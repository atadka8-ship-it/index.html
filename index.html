                <button class="btn btn-outline" data-action="timer-complete-early">${iconSvg('check', 16)} Log ${elapsedMinutes}m Now</button>
              ` : ''}
            </div>

            <div class="form-row" style="text-align:left;padding-top:16px;border-top:1px solid var(--border);">
              <div class="form-group" style="margin:0;">
                <label class="form-label" for="timer-subject-select">Subject</label>
                <select class="select" id="timer-subject-select">
                  ${subjects.map(s => `<option value="${s}" ${appState.timer.subject === s ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
              </div>
              <div class="form-group" style="margin:0;">
                <label class="form-label" for="timer-chapter-select">Chapter (Optional)</label>
                <select class="select" id="timer-chapter-select">
                  <option value="">General Subject Study</option>
                  ${subjChapters.map(c => `<option value="${c.id}" ${appState.timer.chapterId === c.id ? 'selected' : ''}>${escapeHtml(c.title)}</option>`).join('')}
                </select>
              </div>
            </div>
          </div>

          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <h2 class="section-title">Recent Focus Sessions</h2>
              <span class="muted" style="font-size:0.8rem;">Total: ${m.totalHours}h</span>
            </div>
            ${recentSessions.length === 0 ? `
              <div class="empty-state">
                <p class="muted" style="font-size:0.875rem;">No completed focus sessions yet. Start your first timer block to log study hours.</p>
              </div>
            ` : `
              <div style="display:flex;flex-direction:column;gap:8px;">
                ${recentSessions.map(s => {
                  const ch = appState.data.chapters.find(c => c.id === s.chapterId);
                  return `
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:6px;">
                      <div>
                        <div style="font-size:0.875rem;font-weight:700;color:var(--maroon);">${escapeHtml(s.subject)} ${ch ? '— ' + escapeHtml(ch.title) : ''}</div>
                        <div class="muted" style="font-size:0.75rem;">${formatDisplayDate(s.date)} &bull; ${escapeHtml(s.mode || 'Focus')}</div>
                      </div>
                      <span class="badge badge-lime tabular">${s.durationMinutes} min</span>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    /* --------------------------------------------------------------------------
       SECTION 4: MY SUBJECTS
       -------------------------------------------------------------------------- */
    function renderSubjectsSection(m) {
      const subjects = EXAM_SUBJECTS[appState.user.exam];
      return `
        <div class="page-header">
          <div>
            <h1 class="page-title">My Subjects (${escapeHtml(appState.user.exam)})</h1>
            <p class="page-subtitle">Subject-level mastery, time invested, and test accuracy overview.</p>
          </div>
          <button class="btn btn-maroon" data-action="nav" data-section="syllabus">Open Full Syllabus Tracker &rarr;</button>
        </div>

        <div class="grid-2">
          ${subjects.map(subj => {
            const st = m.subjectStats[subj];
            const revCount = appState.data.chapters.filter(c => c.subject === subj && (c.revisions?.first || c.revisions?.second || c.revisions?.third)).length;
            return `
              <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;">
                  <div>
                    <span class="badge badge-maroon" style="margin-bottom:6px;">${escapeHtml(appState.user.exam)} Core</span>
                    <h2 style="font-size:1.25rem;font-weight:800;color:var(--maroon);">${escapeHtml(subj)}</h2>
                  </div>
                  <span class="badge badge-lime tabular" style="font-size:0.85rem;">${st.progressPct}% Complete</span>
                </div>
                <div class="progress-track" style="margin-bottom:16px;">
                  <div class="progress-fill" style="width:${st.progressPct}%;"></div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;">
                  <div class="card-soft" style="padding:10px;">
                    <div class="stat-label" style="font-size:0.65rem;">Completed</div>
                    <strong class="tabular">${st.completedChapters}/${st.totalChapters}</strong>
                  </div>
                  <div class="card-soft" style="padding:10px;">
                    <div class="stat-label" style="font-size:0.65rem;">In Progress</div>
                    <strong class="tabular">${st.inProgressChapters}</strong>
                  </div>
                  <div class="card-soft" style="padding:10px;">
                    <div class="stat-label" style="font-size:0.65rem;">Study Time</div>
                    <strong class="tabular">${st.hours}h</strong>
                  </div>
                  <div class="card-soft" style="padding:10px;">
                    <div class="stat-label" style="font-size:0.65rem;">Mock Avg</div>
                    <strong class="tabular">${st.avgSubjScore !== null ? st.avgSubjScore : '—'}</strong>
                  </div>
                </div>
                <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--border);">
                  <span class="muted" style="font-size:0.8rem;">${revCount} chapter(s) revised at least once</span>
                  <div style="display:flex;gap:8px;">
                    <button class="btn btn-outline btn-sm" data-action="jump-syllabus-subject" data-subject="${subj}">Chapters</button>
                    <button class="btn btn-lime btn-sm" data-action="start-timer-subject" data-subject="${subj}">Focus Now</button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    /* --------------------------------------------------------------------------
       SECTION 5: SYLLABUS TRACKER
       -------------------------------------------------------------------------- */
    function renderSyllabusSection(m) {
      const subjects = EXAM_SUBJECTS[appState.user.exam];
      const filtered = appState.data.chapters.filter(c => {
        if (appState.syllabusSubject !== 'All' && c.subject !== appState.syllabusSubject) return false;
        if (appState.syllabusStatus !== 'All' && c.status !== appState.syllabusStatus) return false;
        if (appState.syllabusSearch && !c.title.toLowerCase().includes(appState.syllabusSearch.toLowerCase())) return false;
        return true;
      });

      return `
        <div class="page-header">
          <div>
            <h1 class="page-title">Syllabus Tracker</h1>
            <p class="page-subtitle">Overall completion: <strong>${m.syllabusPct}%</strong> (${m.completedChapters} of ${m.totalChapters} chapters completed)</p>
          </div>
          <button class="btn btn-lime" data-action="open-chapter-modal">${iconSvg('plus', 15)} Add Chapter</button>
        </div>

        <div class="grid-4" style="margin-bottom:18px;">
          ${subjects.map(subj => {
            const st = m.subjectStats[subj];
            return `
              <div class="card" style="padding:14px;">
                <div style="display:flex;justify-content:space-between;font-size:0.85rem;font-weight:700;margin-bottom:6px;">
                  <span style="color:var(--maroon);">${subj}</span>
                  <span class="tabular">${st.progressPct}%</span>
                </div>
                <div class="progress-track" style="height:6px;margin-bottom:4px;">
                  <div class="progress-fill" style="width:${st.progressPct}%;"></div>
                </div>
                <div class="muted" style="font-size:0.75rem;">${st.completedChapters}/${st.totalChapters} chapters done</div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="card" style="margin-bottom:16px;padding:14px;">
          <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;">
            <div class="tabs-bar">
              <button class="tab-btn ${appState.syllabusSubject === 'All' ? 'active' : ''}" data-action="filter-syllabus-subject" data-subject="All">All</button>
              ${subjects.map(s => `
                <button class="tab-btn ${appState.syllabusSubject === s ? 'active' : ''}" data-action="filter-syllabus-subject" data-subject="${s}">${s}</button>
              `).join('')}
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <select class="select" id="syllabus-status-filter" style="width:auto;">
                <option value="All" ${appState.syllabusStatus === 'All' ? 'selected' : ''}>All Statuses</option>
                <option value="Not Started" ${appState.syllabusStatus === 'Not Started' ? 'selected' : ''}>Not Started</option>
                <option value="In Progress" ${appState.syllabusStatus === 'In Progress' ? 'selected' : ''}>In Progress</option>
                <option value="Completed" ${appState.syllabusStatus === 'Completed' ? 'selected' : ''}>Completed</option>
              </select>
              <input class="input" id="syllabus-search-input" type="search" placeholder="Search chapter..." value="${escapeHtml(appState.syllabusSearch)}" style="width:200px;" />
            </div>
          </div>
        </div>

        ${filtered.length === 0 ? `
          <div class="empty-state">
            <p class="muted" style="margin-bottom:12px;">No chapters match your current filter.</p>
            <button class="btn btn-outline btn-sm" data-action="open-chapter-modal">+ Add Custom Chapter</button>
          </div>
        ` : `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Chapter</th>
                  <th>Subject</th>
                  <th>Status</th>
                  <th style="width:180px;">Progress</th>
                  <th>Revisions</th>
                  <th>Deadline</th>
                  <th style="text-align:right;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${filtered.map(ch => `
                  <tr>
                    <td>
                      <div style="font-weight:600;">${escapeHtml(ch.title)}</div>
                      ${ch.notes ? `<div class="muted" style="font-size:0.75rem;">${escapeHtml(ch.notes)}</div>` : ''}
                    </td>
                    <td><span class="badge badge-grey">${escapeHtml(ch.subject)}</span></td>
                    <td>
                      <select class="select" data-action="change-chapter-status" data-id="${ch.id}" style="padding:5px 8px;font-size:0.8rem;width:auto;">
                        <option value="Not Started" ${ch.status === 'Not Started' ? 'selected' : ''}>Not Started</option>
                        <option value="In Progress" ${ch.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                        <option value="Completed" ${ch.status === 'Completed' ? 'selected' : ''}>Completed</option>
                      </select>
                    </td>
                    <td>
                      <div style="display:flex;align-items:center;gap:8px;">
                        <input type="range" min="0" max="100" step="5" value="${ch.progress}" data-action="change-chapter-progress" data-id="${ch.id}" style="flex:1;accent-color:var(--maroon);" />
                        <span class="tabular" style="font-size:0.78rem;font-weight:700;width:36px;">${ch.progress}%</span>
                      </div>
                    </td>
                    <td>
                      <div style="display:flex;gap:4px;">
                        ${['first', 'second', 'third'].map((r, i) => `
                          <button class="badge ${ch.revisions?.[r] ? 'badge-lime' : 'badge-grey'}" data-action="toggle-chapter-rev" data-id="${ch.id}" data-rev="${r}" title="Toggle ${i + 1}st/nd/rd revision">R${i + 1}</button>
                        `).join('')}
                      </div>
                    </td>
                    <td class="tabular">${formatDisplayDate(ch.deadline)}</td>
                    <td style="text-align:right;white-space:nowrap;">
                      <button class="btn btn-ghost btn-sm" data-action="edit-chapter" data-id="${ch.id}" title="Edit">${iconSvg('edit', 14)}</button>
                      <button class="btn btn-ghost btn-sm" data-action="delete-chapter" data-id="${ch.id}" title="Delete" style="color:var(--danger);">${iconSvg('trash', 14)}</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `}
      `;
    }

    /* --------------------------------------------------------------------------
       SECTION 6: MOCK TEST TRACKER
       -------------------------------------------------------------------------- */
    function renderMockTestsSection(m) {
      const tests = m.sortedTests;
      const subjects = EXAM_SUBJECTS[appState.user.exam];
      const latest = tests[tests.length - 1];
      const latestPct = latest ? Math.round((latest.obtainedMarks / latest.totalMarks) * 100) : 0;

      return `
        <div class="page-header">
          <div>
            <h1 class="page-title">Mock Test Tracker</h1>
            <p class="page-subtitle">Log full-syllabus and part tests, analyze accuracy, and review mistake patterns.</p>
          </div>
          <button class="btn btn-lime" data-action="open-test-modal">${iconSvg('plus', 15)} Add Mock Test</button>
        </div>

        <div class="grid-4" style="margin-bottom:20px;">
          <div class="stat-card">
            <span class="stat-label">Tests Taken</span>
            <span class="stat-value tabular">${tests.length}</span>
            <span class="stat-foot">Recorded evaluations</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Average Score</span>
            <span class="stat-value tabular">${m.avgTestPct}%</span>
            <span class="stat-foot">${latest ? `Latest: ${latestPct}%` : 'No tests yet'}</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Highest Score</span>
            <span class="stat-value tabular">${m.highestTest ? `${m.highestTest.obtainedMarks}/${m.highestTest.totalMarks}` : '—'}</span>
            <span class="stat-foot">${m.highestTest ? escapeHtml(m.highestTest.name) : 'Log a test'}</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Score Trend</span>
            <span class="stat-value tabular">${m.improvement > 0 ? '+' : ''}${m.improvement}%</span>
            <span class="stat-foot">First vs. latest test</span>
          </div>
        </div>

        ${tests.length === 0 ? `
          <div class="empty-state">
            <h3 style="color:var(--maroon);margin-bottom:6px;">No mock tests logged yet</h3>
            <p class="muted" style="font-size:0.875rem;margin-bottom:14px;">Record your coaching or NTA practice tests to visualize subject strengths and accuracy trends.</p>
            <button class="btn btn-lime" data-action="open-test-modal">+ Log First Mock Test</button>
          </div>
        ` : `
          <div class="grid-2" style="margin-bottom:20px;">
            <div class="card">
              <h2 class="section-title" style="margin-bottom:12px;">Score Percentage Trend</h2>
              ${renderLineChartSvg(tests.map((t, i) => ({
                label: t.name,
                shortLabel: `T${i + 1}`,
                value: t.totalMarks > 0 ? Math.round((t.obtainedMarks / t.totalMarks) * 100) : 0
              })), 195)}
            </div>
            <div class="card">
              <h2 class="section-title" style="margin-bottom:12px;">Subject-Wise Average Marks</h2>
              <div style="display:flex;flex-direction:column;gap:12px;margin-top:10px;">
                ${subjects.map(subj => {
                  const avg = m.subjectStats[subj].avgSubjScore || 0;
                  const maxPerSubj = appState.user.exam === 'NEET' ? 180 : 100;
                  const pct = Math.min(100, Math.round((avg / maxPerSubj) * 100));
                  return `
                    <div>
                      <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:4px;">
                        <strong>${subj}</strong>
                        <span class="tabular">${avg} / ${maxPerSubj} (${pct}%)</span>
                      </div>
                      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Test Name</th>
                  <th>Date</th>
                  <th>Marks</th>
                  <th>Subject Breakdown</th>
                  <th>Accuracy</th>
                  <th>Mistakes</th>
                  <th style="text-align:right;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${[...tests].reverse().map(t => {
                  const pct = t.totalMarks > 0 ? Math.round((t.obtainedMarks / t.totalMarks) * 100) : 0;
                  return `
                    <tr>
                      <td>
                        <div style="font-weight:700;color:var(--maroon);">${escapeHtml(t.name)}</div>
                        <div class="muted" style="font-size:0.75rem;">${escapeHtml(t.type)} ${t.notes ? '&bull; ' + escapeHtml(t.notes) : ''}</div>
                      </td>
                      <td class="tabular">${formatDisplayDate(t.date)}</td>
                      <td class="tabular"><strong>${t.obtainedMarks}/${t.totalMarks}</strong> <span class="badge badge-lime">${pct}%</span></td>
                      <td style="font-size:0.78rem;">
                        ${subjects.map(s => `<span style="margin-right:8px;"><strong>${s.slice(0, 3)}:</strong> ${t.subjectScores?.[s] ?? '—'}</span>`).join('')}
                      </td>
                      <td class="tabular">${t.accuracy}%</td>
                      <td class="tabular">${t.mistakes}</td>
                      <td style="text-align:right;">
                        <button class="btn btn-ghost btn-sm" data-action="delete-test" data-id="${t.id}" style="color:var(--danger);">${iconSvg('trash', 14)}</button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `}
      `;
    }

    /* --------------------------------------------------------------------------
       SECTION 7: NOTES & REVISION MANAGER
       -------------------------------------------------------------------------- */
    function renderNotesSection() {
      const subjects = EXAM_SUBJECTS[appState.user.exam];
      const filteredNotes = appState.data.notes.filter(n => {
        if (appState.notesSubjectFilter !== 'All' && n.subject !== appState.notesSubjectFilter) return false;
        if (appState.notesSearch) {
          const q = appState.notesSearch.toLowerCase();
          if (!n.title.toLowerCase().includes(q) && !n.content.toLowerCase().includes(q)) return false;
        }
        return true;
      });

      const revisionChapters = appState.data.chapters.filter(c =>
        appState.notesSubjectFilter === 'All' || c.subject === appState.notesSubjectFilter
      );

      return `
        <div class="page-header">
          <div>
            <h1 class="page-title">Notes &amp; Revision Manager</h1>
            <p class="page-subtitle">Organize chapter summaries and track 1st, 2nd, and 3rd revision passes.</p>
          </div>
          <div style="display:flex;gap:10px;align-items:center;">
            <div class="tabs-bar">
              <button class="tab-btn ${appState.notesTab === 'notes' ? 'active' : ''}" data-action="set-notes-tab" data-tab="notes">Study Notes (${appState.data.notes.length})</button>
              <button class="tab-btn ${appState.notesTab === 'revision' ? 'active' : ''}" data-action="set-notes-tab" data-tab="revision">Revision Checklist</button>
            </div>
            <button class="btn btn-lime" data-action="open-note-modal">${iconSvg('plus', 15)} New Note</button>
          </div>
        </div>

        <div class="card" style="padding:14px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;">
          <div class="tabs-bar">
            <button class="tab-btn ${appState.notesSubjectFilter === 'All' ? 'active' : ''}" data-action="filter-notes-subject" data-subject="All">All Subjects</button>
            ${subjects.map(s => `
              <button class="tab-btn ${appState.notesSubjectFilter === s ? 'active' : ''}" data-action="filter-notes-subject" data-subject="${s}">${s}</button>
            `).join('')}
          </div>
          ${appState.notesTab === 'notes' ? `
            <input class="input" id="notes-search-input" type="search" placeholder="Search notes..." value="${escapeHtml(appState.notesSearch)}" style="width:220px;" />
          ` : ''}
        </div>

        ${appState.notesTab === 'notes' ? `
          ${filteredNotes.length === 0 ? `
            <div class="empty-state">
              <p class="muted" style="margin-bottom:12px;">No study notes found. Capture key formulas, NCERT exceptions, or mistake takeaways.</p>
              <button class="btn btn-lime btn-sm" data-action="open-note-modal">+ Create First Note</button>
            </div>
          ` : `
            <div class="grid-3">
              ${filteredNotes.map(n => {
                const ch = appState.data.chapters.find(c => c.id === n.chapterId);
                return `
                  <div class="card" style="display:flex;flex-direction:column;justify-content:space-between;">
                    <div>
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                        <span class="badge badge-maroon">${escapeHtml(n.subject)}</span>
                        <span class="muted" style="font-size:0.72rem;">${formatDisplayDate(n.updatedAt)}</span>
                      </div>
                      <h3 style="font-size:1rem;font-weight:700;margin-bottom:4px;">${escapeHtml(n.title)}</h3>
                      ${ch ? `<div class="muted" style="font-size:0.75rem;margin-bottom:8px;">Chapter: ${escapeHtml(ch.title)}</div>` : ''}
                      <p style="font-size:0.85rem;color:var(--charcoal);white-space:pre-line;margin-bottom:14px;">${escapeHtml(n.content)}</p>
                    </div>
                    <div style="display:flex;justify-content:flex-end;gap:6px;padding-top:10px;border-top:1px solid var(--border);">
                      <button class="btn btn-outline btn-sm" data-action="edit-note" data-id="${n.id}">Edit</button>
                      <button class="btn btn-danger btn-sm" data-action="delete-note" data-id="${n.id}">Delete</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        ` : `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Chapter</th>
                  <th>Subject</th>
                  <th>Marked for Revision</th>
                  <th>1st Revision</th>
                  <th>2nd Revision</th>
                  <th>3rd Revision</th>
                  <th>Last Revised</th>
                </tr>
              </thead>
              <tbody>
                ${revisionChapters.map(ch => `
                  <tr>
                    <td style="font-weight:600;">${escapeHtml(ch.title)}</td>
                    <td><span class="badge badge-grey">${escapeHtml(ch.subject)}</span></td>
                    <td>
                      <button class="badge ${ch.markedForRevision ? 'badge-warning' : 'badge-grey'}" data-action="toggle-mark-revision" data-id="${ch.id}">
                        ${ch.markedForRevision ? 'Flagged for Revision' : 'Mark for Revision'}
                      </button>
                    </td>
                    <td><input type="checkbox" ${ch.revisions?.first ? 'checked' : ''} data-action="toggle-chapter-rev" data-id="${ch.id}" data-rev="first" /></td>
                    <td><input type="checkbox" ${ch.revisions?.second ? 'checked' : ''} data-action="toggle-chapter-rev" data-id="${ch.id}" data-rev="second" /></td>
                    <td><input type="checkbox" ${ch.revisions?.third ? 'checked' : ''} data-action="toggle-chapter-rev" data-id="${ch.id}" data-rev="third" /></td>
                    <td class="tabular">${formatDisplayDate(ch.lastRevised)}</td>
                  </tr>
                `).join('')}
              </tbody>

    /* --------------------------------------------------------------------------
       SECTION 8: PERFORMANCE ANALYTICS
       -------------------------------------------------------------------------- */
    function renderAnalyticsSection(m) {
      const user = appState.user;
      const subjects = EXAM_SUBJECTS[user.exam];
      const rangeDays = appState.analyticsRange;
      const rangeBars = [];
      let rangeTotalMins = 0;
      for (let i = rangeDays - 1; i >= 0; i--) {
        const d = addDays(m.today, -i);
        const mins = m.dailyMinsMap[d] || 0;
        rangeTotalMins += mins;
        const dt = new Date(d + 'T00:00:00');
        rangeBars.push({
          label: rangeDays <= 14 ? dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }).replace(' ', '') : (i % 4 === 0 ? String(dt.getDate()) : ''),
          value: +(mins / 60).toFixed(2),
          highlight: (mins / 60) >= user.dailyGoalHours
        });
      }
      const avgDailyHrs = +(rangeTotalMins / 60 / rangeDays).toFixed(1);
      const totalSubjMins = Math.max(1, subjects.reduce((s, subj) => s + m.subjectStats[subj].minutes, 0));

      // 12-week heatmap (84 days)
      const weeks = [];
      for (let w = 11; w >= 0; w--) {
        const col = [];
        for (let d = 6; d >= 0; d--) {
          const dtStr = addDays(m.today, -(w * 7 + d));
          const mins = m.dailyMinsMap[dtStr] || 0;
          col.push({ date: dtStr, mins });
        }
        weeks.push(col);
      }

      return `
        <div class="page-header">
          <div>
            <h1 class="page-title">Performance Analytics</h1>
            <p class="page-subtitle">Real-time productivity metrics derived from your logged focus blocks, syllabus, and mock tests.</p>
          </div>
          <div class="tabs-bar">
            ${[7, 14, 30].map(r => `
              <button class="tab-btn ${appState.analyticsRange === r ? 'active' : ''}" data-action="set-analytics-range" data-range="${r}">${r} Days</button>
            `).join('')}
          </div>
        </div>

        <div class="grid-4" style="margin-bottom:20px;">
          <div class="stat-card">
            <span class="stat-label">${rangeDays}-Day Total</span>
            <span class="stat-value tabular">${+(rangeTotalMins / 60).toFixed(1)}h</span>
            <span class="stat-foot">Target: ${(user.dailyGoalHours * rangeDays).toFixed(0)}h</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Daily Average</span>
            <span class="stat-value tabular">${avgDailyHrs}h</span>
            <span class="stat-foot">Goal: ${user.dailyGoalHours}h/day</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Monthly Productivity</span>
            <span class="stat-value tabular">${Math.min(100, Math.round((avgDailyHrs / Math.max(0.5, user.dailyGoalHours)) * 100))}%</span>
            <span class="stat-foot">Target adherence</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Best Study Day</span>
            <span class="stat-value tabular">${m.bestDayHours}h</span>
            <span class="stat-foot">Longest streak: ${m.longestStreak}d</span>
          </div>
        </div>

        <div class="grid-2" style="margin-bottom:20px;">
          <div class="card">
            <h2 class="section-title" style="margin-bottom:12px;">Target vs. Actual Study Hours (${rangeDays}D)</h2>
            ${renderBarChartSvg(rangeBars, user.dailyGoalHours, 200)}
          </div>
          <div class="card">
            <h2 class="section-title" style="margin-bottom:12px;">Subject-Wise Time Distribution</h2>
            <div style="display:flex;flex-direction:column;gap:14px;margin-top:12px;">
              ${subjects.map(subj => {
                const st = m.subjectStats[subj];
                const share = Math.round((st.minutes / totalSubjMins) * 100);
                return `
                  <div>
                    <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:5px;">
                      <strong>${subj}</strong>
                      <span class="tabular">${st.hours}h (${share}%)</span>
                    </div>
                    <div class="progress-track">
                      <div class="progress-fill" style="width:${share}%;background:${SUBJECT_COLORS[subj] || 'var(--maroon)'};"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h2 class="section-title" style="margin-bottom:8px;">12-Week Study Streak History</h2>
            <p class="muted" style="font-size:0.8rem;margin-bottom:14px;">Each square represents one day. Lime indicates meeting or exceeding your ${user.dailyGoalHours}h daily target.</p>
            <div class="heatmap-grid">
              ${weeks.map(col => `
                <div class="heatmap-col">
                  ${col.map(cell => {
                    const hrs = cell.mins / 60;
                    let bg = '#F3F1F2';
                    if (hrs >= user.dailyGoalHours) bg = '#C6FF45';
                    else if (hrs >= user.dailyGoalHours * 0.5) bg = '#650D25';
                    else if (cell.mins > 0) bg = '#B58391';
                    return `<div class="heatmap-cell" style="background:${bg};" title="${cell.date}: ${cell.mins}m"></div>`;
                  }).join('')}
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card">
            <h2 class="section-title" style="margin-bottom:12px;">Mock Test Performance Trend</h2>
            ${m.sortedTests.length === 0 ? `
              <div class="empty-state" style="padding:24px;">
                <p class="muted" style="font-size:0.85rem;">Add mock tests to view your score improvement curve here.</p>
              </div>
            ` : renderLineChartSvg(m.sortedTests.map((t, i) => ({
              label: t.name,
              shortLabel: `Test ${i + 1}`,
              value: Math.round((t.obtainedMarks / t.totalMarks) * 100)
            })), 175)}
          </div>
        </div>
      `;
    }

        <div class="grid-3">
          ${badges.map(b => {
            const unlocked = b.cur >= b.req;

            return `
              <div class="card" style="border-color:${unlocked ? 'var(--maroon)' : 'var(--border)'};background:${unlocked ? 'var(--white)' : 'var(--soft-grey)'};">

    /* ==========================================================================
       11. MODALS FOR CRUD OPERATIONS (TASKS, CHAPTERS, MOCK TESTS, NOTES)
       ========================================================================== */
    function openTaskModal(editTask = null, defaultDate = null) {
      const subjects = EXAM_SUBJECTS[appState.user.exam];
      const t = editTask || {
        title: '', subject: subjects[0], chapterId: '', date: defaultDate || appState.plannerDate || toLocalDateStr(),
        time: '17:00', priority: 'Medium', deadline: defaultDate || toLocalDateStr(), notes: ''
      };
      openModal(editTask ? 'Edit Study Task' : 'Create Study Task', `
        <form id="task-modal-form">
          <div class="form-group">
            <label class="form-label" for="t-title">Task Title</label>
            <input class="input" id="t-title" required value="${escapeHtml(t.title)}" placeholder="e.g., Solve 40 Electrostatics MCQs" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="t-subject">Subject</label>
              <select class="select" id="t-subject">
                ${subjects.map(s => `<option value="${s}" ${t.subject === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="t-priority">Priority</label>
              <select class="select" id="t-priority">
                ${['High', 'Medium', 'Low'].map(p => `<option value="${p}" ${t.priority === p ? 'selected' : ''}>${p}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="t-date">Scheduled Date</label>
              <input class="input" id="t-date" type="date" value="${t.date}" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="t-time">Time</label>
              <input class="input" id="t-time" type="time" value="${t.time || '17:00'}" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="t-deadline">Deadline</label>
            <input class="input" id="t-deadline" type="date" value="${t.deadline || t.date}" />
          </div>
          <div class="form-group">
            <label class="form-label" for="t-notes">Notes (Optional)</label>
            <textarea class="textarea" id="t-notes" placeholder="Target source, page numbers, or focus points...">${escapeHtml(t.notes || '')}</textarea>
          </div>
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-lime">${editTask ? 'Save Task' : 'Add Task'}</button>
          </div>
        </form>
      `, () => {
        document.getElementById('task-modal-form').onsubmit = (e) => {
          e.preventDefault();
          const payload = {
            id: editTask ? editTask.id : uid('tsk'),
            title: document.getElementById('t-title').value.trim(),
            subject: document.getElementById('t-subject').value,
            chapterId: '',
            date: document.getElementById('t-date').value,
            time: document.getElementById('t-time').value,
            priority: document.getElementById('t-priority').value,
            deadline: document.getElementById('t-deadline').value,
            notes: document.getElementById('t-notes').value.trim(),
            completed: editTask ? editTask.completed : false
          };
          if (!payload.title) return;
          if (editTask) {
            const idx = appState.data.tasks.findIndex(x => x.id === editTask.id);
            if (idx >= 0) appState.data.tasks[idx] = payload;
            showToast('Task updated');
          } else {
            appState.data.tasks.push(payload);
            showToast('Study task added');
          }
          persistCurrentUserData();
          closeModal();
          render();
        };
      });
    }

    function openChapterModal(editChapter = null) {
      const subjects = EXAM_SUBJECTS[appState.user.exam];
      const ch = editChapter || {
        subject: appState.syllabusSubject !== 'All' ? appState.syllabusSubject : subjects[0],
        title: '', status: 'Not Started', progress: 0, deadline: '', notes: ''
      };
      openModal(editChapter ? 'Edit Chapter' : 'Add Syllabus Chapter', `
        <form id="chapter-modal-form">
          <div class="form-group">
            <label class="form-label" for="ch-title">Chapter Name</label>
            <input class="input" id="ch-title" required value="${escapeHtml(ch.title)}" placeholder="e.g., Wave Optics" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="ch-subject">Subject</label>
              <select class="select" id="ch-subject">
                ${subjects.map(s => `<option value="${s}" ${ch.subject === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="ch-status">Status</label>
              <select class="select" id="ch-status">
                ${['Not Started', 'In Progress', 'Completed'].map(st => `<option value="${st}" ${ch.status === st ? 'selected' : ''}>${st}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="ch-progress">Progress (%)</label>
              <input class="input" id="ch-progress" type="number" min="0" max="100" value="${ch.progress}" />
            </div>
            <div class="form-group">
              <label class="form-label" for="ch-deadline">Target Deadline</label>
              <input class="input" id="ch-deadline" type="date" value="${ch.deadline || ''}" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="ch-notes">Chapter Notes</label>
            <textarea class="textarea" id="ch-notes" placeholder="Weak topics, pending PYQs, NCERT line reminders...">${escapeHtml(ch.notes || '')}</textarea>
          </div>
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-lime">${editChapter ? 'Save Chapter' : 'Add Chapter'}</button>
          </div>
        </form>
      `, () => {
        document.getElementById('chapter-modal-form').onsubmit = (e) => {
          e.preventDefault();
          const st = document.getElementById('ch-status').value;
          let prog = Math.max(0, Math.min(100, Number(document.getElementById('ch-progress').value) || 0));
          if (st === 'Completed') prog = 100;
          if (st === 'Not Started' && !editChapter) prog = 0;

          const payload = {
            id: editChapter ? editChapter.id : uid('ch'),
            subject: document.getElementById('ch-subject').value,
            title: document.getElementById('ch-title').value.trim(),
            status: st,
            progress: prog,
            deadline: document.getElementById('ch-deadline').value,
            notes: document.getElementById('ch-notes').value.trim(),
            markedForRevision: editChapter ? editChapter.markedForRevision : false,
            revisions: editChapter ? editChapter.revisions : { first: false, second: false, third: false },
            lastRevised: editChapter ? editChapter.lastRevised : ''
          };
          if (!payload.title) return;
          if (editChapter) {
            const idx = appState.data.chapters.findIndex(x => x.id === editChapter.id);
            if (idx >= 0) appState.data.chapters[idx] = payload;
            showToast('Chapter updated');
          } else {
            appState.data.chapters.push(payload);
            showToast('Chapter added to syllabus');
          }
          persistCurrentUserData();
          closeModal();
          render();
        };
      });
    }

      };

    /* ==========================================================================
       12. GLOBAL EVENT BINDING & RENDER LOOP
       ========================================================================== */
    function render() {
      const root = document.getElementById('root');
      if (appState.screen === 'landing') {
        root.innerHTML = renderLanding();
      } else if (appState.screen === 'auth') {
        root.innerHTML = renderAuth();
      } else {
        root.innerHTML = renderAppShell();
      }
      bindDynamicEvents();
    }

    function bindDynamicEvents() {
      // Auth forms
      const loginForm = document.getElementById('login-form');
      if (loginForm) {
        loginForm.onsubmit = (e) => {
          e.preventDefault();
          const email = document.getElementById('login-email').value.trim().toLowerCase();
          const pw = document.getElementById('login-password').value;
          const users = loadUsers();
          const user = users.find(u => u.email.toLowerCase() === email && u.passwordHash === simpleHash(pw));
          if (!user) {
            const err = document.getElementById('auth-error');
            err.textContent = 'Invalid email or password. Please check your credentials or try a sample account.';
            err.classList.remove('hidden');
            return;
          }
          setSessionUserId(user.id);
          appState.user = user;
          appState.data = loadUserData(user.id, user.exam);
          appState.screen = 'app';
          appState.section = 'dashboard';
          showToast(`Welcome back, ${user.name}!`);
          render();
        };
      }

      const regForm = document.getElementById('register-form');
      if (regForm) {
        regForm.querySelectorAll('input[name="reg-exam"]').forEach(r => {
          r.onchange = () => {
            document.getElementById('opt-neet').classList.toggle('selected', r.value === 'NEET' && r.checked);
            document.getElementById('opt-jee').classList.toggle('selected', r.value === 'JEE' && r.checked);
          };
        });
        regForm.onsubmit = (e) => {
          e.preventDefault();
          const name = document.getElementById('reg-name').value.trim();
          const email = document.getElementById('reg-email').value.trim().toLowerCase();
          const pw = document.getElementById('reg-password').value;
          const exam = regForm.querySelector('input[name="reg-exam"]:checked').value;
          const targetYear = document.getElementById('reg-year').value;
          const prepLevel = document.getElementById('reg-level').value;
          const dailyGoalHours = Math.max(1, Math.min(16, Number(document.getElementById('reg-goal').value) || 6));

          const users = loadUsers();
          if (users.some(u => u.email.toLowerCase() === email)) {
            const err = document.getElementById('auth-error');
            err.textContent = 'An account with this email already exists. Please sign in instead.';
            err.classList.remove('hidden');
            return;
          }

          const newUser = {
            id: uid('usr'),
            name,
            email,
            passwordHash: simpleHash(pw),
            exam,
            targetYear,
            prepLevel,
            dailyGoalHours,
            createdAt: toLocalDateStr(),
            preferences: {
              studyReminders: true,
              deadlineAlerts: true,
              revisionPrompts: true,
              timerSound: true
            }
          };
          users.push(newUser);
          saveUsers(users);
          setSessionUserId(newUser.id);
          appState.user = newUser;
          appState.data = loadUserData(newUser.id, newUser.exam);
          appState.screen = 'app';
          appState.section = 'dashboard';
          showToast(`Account created for ${exam} ${targetYear}!`);
          render();
        };
      }

      // Mobile drawer
      const mobBtn = document.getElementById('mobile-menu-btn');
      if (mobBtn) {
        mobBtn.onclick = () => {
          appState.mobileSidebarOpen = !appState.mobileSidebarOpen;
          render();
        };
      }
      const overlay = document.getElementById('sidebar-overlay');
      if (overlay) {
        overlay.onclick = () => {
          appState.mobileSidebarOpen = false;
          render();
        };
      }

      // Notifications popover
      const notifBtn = document.getElementById('notif-toggle-btn');
      if (notifBtn) {
        notifBtn.onclick = (e) => {
          e.stopPropagation();
          appState.notifOpen = !appState.notifOpen;
          render();
        };
      }

      // Global search
      const searchInput = document.getElementById('global-search-input');
      if (searchInput) {
        searchInput.oninput = (e) => {
          appState.searchQuery = e.target.value;
          renderGlobalSearchDropdown();
        };
        if (appState.searchQuery) renderGlobalSearchDropdown();
      }

      // Planner filters & date pickers
      const pDate = document.getElementById('planner-date-picker');
      if (pDate) {
        pDate.onchange = (e) => {
          appState.plannerDate = e.target.value || toLocalDateStr();
          render();
        };
      }
      const pSubj = document.getElementById('planner-subject-filter');
      if (pSubj) {
        pSubj.onchange = (e) => {
          appState.plannerFilterSubject = e.target.value;
          render();
        };
      }

      // Timer selects
      const tSubj = document.getElementById('timer-subject-select');
      if (tSubj) {
        tSubj.onchange = (e) => {
          appState.timer.subject = e.target.value;
          appState.timer.chapterId = '';
          render();
        };
      }
      const tChap = document.getElementById('timer-chapter-select');
      if (tChap) {
        tChap.onchange = (e) => {
          appState.timer.chapterId = e.target.value;
        };
      }

      // Syllabus filters
      const sStat = document.getElementById('syllabus-status-filter');
      if (sStat) {
        sStat.onchange = (e) => {
          appState.syllabusStatus = e.target.value;
          render();
        };
      }
      const sSearch = document.getElementById('syllabus-search-input');
      if (sSearch) {
        sSearch.oninput = (e) => {
          appState.syllabusSearch = e.target.value;
          render();
          const el = document.getElementById('syllabus-search-input');
          if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        };
      }

      // Notes search
      const nSearch = document.getElementById('notes-search-input');
      if (nSearch) {
        nSearch.oninput = (e) => {
          appState.notesSearch = e.target.value;
          render();
          const el = document.getElementById('notes-search-input');
          if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        };
      }

      // Settings forms
      const setProfForm = document.getElementById('settings-profile-form');
      if (setProfForm) {
        setProfForm.onsubmit = (e) => {
          e.preventDefault();
          const newExam = document.getElementById('set-exam').value;
          const oldExam = appState.user.exam;
          appState.user.name = document.getElementById('set-name').value.trim();
          appState.user.email = document.getElementById('set-email').value.trim().toLowerCase();
          appState.user.exam = newExam;
          appState.user.targetYear = document.getElementById('set-year').value;
          appState.user.prepLevel = document.getElementById('set-level').value;
          appState.user.dailyGoalHours = Math.max(1, Math.min(16, Number(document.getElementById('set-goal').value) || 6));

          if (oldExam !== newExam) {
            const newSubjects = EXAM_SUBJECTS[newExam];
            newSubjects.forEach(s => {
              const hasAny = appState.data.chapters.some(c => c.subject === s);
              if (!hasAny) {
                (DEFAULT_SYLLABUS[s] || []).forEach(title => {
                  appState.data.chapters.push({
                    id: uid('ch'), subject: s, title, status: 'Not Started', progress: 0,
                    deadline: '', notes: '', markedForRevision: false,
                    revisions: { first: false, second: false, third: false }, lastRevised: ''
                  });
                });
              }
            });
            appState.timer.subject = newSubjects[0];
            persistCurrentUserData();
          }

          const users = loadUsers().map(u => u.id === appState.user.id ? appState.user : u);
          saveUsers(users);
          showToast('Profile settings saved');
          render();
        };
      }

      const setPrefsForm = document.getElementById('settings-prefs-form');
      if (setPrefsForm) {
        setPrefsForm.onsubmit = (e) => {
          e.preventDefault();
          appState.user.preferences = {
            studyReminders: document.getElementById('pref-study').checked,
            deadlineAlerts: document.getElementById('pref-deadline').checked,
            revisionPrompts: document.getElementById('pref-revision').checked,
            timerSound: document.getElementById('pref-sound').checked
          };
          const users = loadUsers().map(u => u.id === appState.user.id ? appState.user : u);
          saveUsers(users);
          showToast('Notification preferences updated');
        };
      }

      const setPwForm = document.getElementById('settings-password-form');
      if (setPwForm) {
        setPwForm.onsubmit = (e) => {
          e.preventDefault();
          const cur = document.getElementById('pw-current').value;
          const nw = document.getElementById('pw-new').value;
          if (simpleHash(cur) !== appState.user.passwordHash) {
            showToast('Current password is incorrect');
            return;
          }
          appState.user.passwordHash = simpleHash(nw);
          const users = loadUsers().map(u => u.id === appState.user.id ? appState.user : u);
          saveUsers(users);
          setPwForm.reset();
          showToast('Password updated successfully');
        };
      }
    }

    function renderGlobalSearchDropdown() {
      const container = document.getElementById('global-search-results');
      if (!container) return;
      const q = appState.searchQuery.trim().toLowerCase();
      if (!q) {
        container.innerHTML = '';
        return;
      }
      const hits = [];
      appState.data.chapters.filter(c => c.title.toLowerCase().includes(q)).slice(0, 4).forEach(c => {
        hits.push({ label: c.title, sub: `Chapter • ${c.subject}`, section: 'syllabus' });
      });
      appState.data.tasks.filter(t => t.title.toLowerCase().includes(q)).slice(0, 3).forEach(t => {
        hits.push({ label: t.title, sub: `Task • ${t.date}`, section: 'planner' });
      });
      appState.data.notes.filter(n => n.title.toLowerCase().includes(q)).slice(0, 3).forEach(n => {
        hits.push({ label: n.title, sub: `Note • ${n.subject}`, section: 'notes' });
      });
      appState.data.mockTests.filter(t => t.name.toLowerCase().includes(q)).slice(0, 2).forEach(t => {
        hits.push({ label: t.name, sub: `Mock Test • ${t.obtainedMarks}/${t.totalMarks}`, section: 'tests' });
      });

      container.innerHTML = `
        <div class="search-dropdown">
          ${hits.length === 0 ? `<div class="muted" style="padding:12px;font-size:0.8rem;">No matching records found.</div>` :
            hits.map(h => `
              <button data-action="search-jump" data-section="${h.section}" style="width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);">
                <div style="font-size:0.825rem;font-weight:600;color:var(--maroon);">${escapeHtml(h.label)}</div>
                <div class="muted" style="font-size:0.72rem;">${escapeHtml(h.sub)}</div>
              </button>
            `).join('')
          }
        </div>
      `;
    }

    // Delegated click & change handlers
    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) {
        if (appState.notifOpen && !e.target.closest('#notif-popover')) {
          appState.notifOpen = false;
          render();
        }
        return;
      }

      const action = target.dataset.action;
      switch (action) {
        case 'go-landing':
          appState.screen = 'landing';
          render();
          break;
        case 'go-auth':
          appState.screen = 'auth';
          appState.authMode = target.dataset.mode || 'login';
          render();
          break;
        case 'switch-auth':
          appState.authMode = target.dataset.mode;
          render();
          break;
        case 'demo-login':
          loginDemoAccount(target.dataset.exam || 'NEET');
          break;
        case 'nav':
          appState.section = target.dataset.section;
          appState.mobileSidebarOpen = false;
          appState.notifOpen = false;
          render();
          break;
        case 'search-jump':
          appState.searchQuery = '';
          appState.section = target.dataset.section;
          render();
          break;
        case 'mark-notifs-read':
          computeMetrics().notifications.forEach(n => appState.readNotifIds.add(n.id));
          render();
          break;

        // Tasks
        case 'open-task-modal':
          openTaskModal(null, target.dataset.date || null);
          break;
        case 'edit-task': {
          const t = appState.data.tasks.find(x => x.id === target.dataset.id);
          if (t) openTaskModal(t);
          break;
        }
        case 'delete-task':
          appState.data.tasks = appState.data.tasks.filter(x => x.id !== target.dataset.id);
          persistCurrentUserData();
          showToast('Task deleted');
          render();
          break;
        case 'set-planner-view':
          appState.plannerView = target.dataset.view;
          render();
          break;
        case 'planner-shift-day':
          appState.plannerDate = addDays(appState.plannerDate, Number(target.dataset.delta));
          render();
          break;
        case 'planner-today':
          appState.plannerDate = toLocalDateStr();
          render();
          break;
        case 'select-planner-date':
          appState.plannerDate = target.dataset.date;
          render();
          break;

        // Timer
        case 'timer-mode':
          setTimerMode(target.dataset.mode);
          break;
        case 'apply-custom-timer': {
          const inp = document.getElementById('custom-timer-mins');
          appState.timer.customMinutes = Math.max(1, Math.min(180, Number(inp?.value) || 45));
          setTimerMode('custom');
          break;
        }
        case 'timer-start':
          startTimer();
          break;
        case 'timer-pause':
          pauseTimer();
          break;
        case 'timer-reset':
          resetTimer();
          break;
        case 'timer-complete-early':
          completeTimerSession(true);
          break;
        case 'start-timer-subject':
          appState.timer.subject = target.dataset.subject;
          appState.timer.chapterId = '';
          appState.section = 'timer';
          render();
          break;

        // Subjects & Syllabus
        case 'jump-syllabus-subject':
          appState.syllabusSubject = target.dataset.subject;
          appState.section = 'syllabus';
          render();
          break;
        case 'filter-syllabus-subject':
          appState.syllabusSubject = target.dataset.subject;
          render();
          break;
        case 'open-chapter-modal':
          openChapterModal();
          break;
        case 'edit-chapter': {
          const ch = appState.data.chapters.find(x => x.id === target.dataset.id);
          if (ch) openChapterModal(ch);
          break;
        }
        case 'delete-chapter':
          appState.data.chapters = appState.data.chapters.filter(x => x.id !== target.dataset.id);
          persistCurrentUserData();
          showToast('Chapter removed');
          render();
          break;
        case 'toggle-chapter-rev': {
          const ch = appState.data.chapters.find(x => x.id === target.dataset.id);
          const rev = target.dataset.rev;
          if (ch) {
            if (!ch.revisions) ch.revisions = { first: false, second: false, third: false };
            ch.revisions[rev] = !ch.revisions[rev];
            ch.lastRevised = toLocalDateStr();
            persistCurrentUserData();
            render();
          }
          break;
        }
        case 'toggle-mark-revision': {
          const ch = appState.data.chapters.find(x => x.id === target.dataset.id);
          if (ch) {
            ch.markedForRevision = !ch.markedForRevision;
            persistCurrentUserData();
            render();
          }
          break;
        }

        // Mock Tests
        case 'open-test-modal':
          openTestModal();
          break;
        case 'delete-test':
          appState.data.mockTests = appState.data.mockTests.filter(x => x.id !== target.dataset.id);
          persistCurrentUserData();
          showToast('Mock test removed');
          render();
          break;

        // Notes
        case 'set-notes-tab':
          appState.notesTab = target.dataset.tab;
          render();
          break;
        case 'filter-notes-subject':
          appState.notesSubjectFilter = target.dataset.subject;
          render();
          break;
        case 'open-note-modal':
          openNoteModal();
          break;
        case 'edit-note': {
          const nt = appState.data.notes.find(x => x.id === target.dataset.id);
          if (nt) openNoteModal(nt);
          break;
        }
        case 'delete-note':
          appState.data.notes = appState.data.notes.filter(x => x.id !== target.dataset.id);
          persistCurrentUserData();
          showToast('Note deleted');
          render();
          break;

        // Analytics
        case 'set-analytics-range':
          appState.analyticsRange = Number(target.dataset.range);
          render();
          break;

        // Settings / Auth
        case 'logout':
          stopTimerInterval();
          setSessionUserId(null);
          appState.user = null;
          appState.data = null;
          appState.screen = 'landing';
          showToast('Signed out');
          render();
          break;
        case 'export-data': {
          const blob = new Blob([JSON.stringify({ user: appState.user, data: appState.data }, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `teachsaathi-backup-${toLocalDateStr()}.json`;
          a.click();
          showToast('Backup exported as JSON');
          break;
        }
        case 'seed-sample-data':
          appState.data = generateSampleData(appState.user.exam);
          persistCurrentUserData();
          showToast('Sample study activity loaded');
          render();
          break;
        case 'delete-account':
          if (confirm('Delete this local student account and all study records? This cannot be undone.')) {
            const uidDel = appState.user.id;
            saveUsers(loadUsers().filter(u => u.id !== uidDel));
            localStorage.removeItem(STORAGE_DATA_PREFIX + uidDel);
            setSessionUserId(null);
            appState.user = null;
            appState.data = null;
            appState.screen = 'landing';
            showToast('Account deleted');
            render();
          }
          break;
      }
    });

    document.addEventListener('change', (e) => {
      const target = e.target;
      const action = target.dataset.action;
      if (!action) return;

      if (action === 'toggle-task') {
        const t = appState.data.tasks.find(x => x.id === target.dataset.id);
        if (t) {
          t.completed = target.checked;
          persistCurrentUserData();
          render();
        }
      } else if (action === 'change-chapter-status') {
        const ch = appState.data.chapters.find(x => x.id === target.dataset.id);
        if (ch) {
          ch.status = target.value;
          if (ch.status === 'Completed') ch.progress = 100;
          else if (ch.status === 'Not Started') ch.progress = 0;
          else if (ch.status === 'In Progress' && (ch.progress === 0 || ch.progress === 100)) ch.progress = 40;
          persistCurrentUserData();
          render();
        }
      } else if (action === 'change-chapter-progress') {
        const ch = appState.data.chapters.find(x => x.id === target.dataset.id);
        if (ch) {
          ch.progress = Number(target.value);
          ch.status = ch.progress >= 100 ? 'Completed' : ch.progress === 0 ? 'Not Started' : 'In Progress';
          persistCurrentUserData();
          render();
        }
      }
    });

    /* ==========================================================================
       13. BOOTSTRAP SESSION
       ========================================================================== */
    (function init() {
      const sessionId = getSessionUserId();
      if (sessionId) {
        const user = loadUsers().find(u => u.id === sessionId);
        if (user) {
          appState.user = user;
          appState.data = loadUserData(user.id, user.exam);
          appState.screen = 'app';
        }
      }
      render();
    })();
  </script>
</body>
</html>

    :root {

    .auth-page {

      bottom: 0;

      transition: transform 0.2s ease;
    }

    .sidebar-header {
      height: var(--topbar-h);

       ========================================================================== */

      flex-direction: column;

    .week-grid {

    /* ==========================================================================
       2. UTILITIES (DATES, ESCAPING, CRYPTO HASHING, TOASTS)
       ========================================================================== */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function toLocalDateStr(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDays(dateStr, delta) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + delta);
      return toLocalDateStr(dt);
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '—';
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function simpleHash(str) {
      let hash = 5381;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) + hash) + str.charCodeAt(i);
      }
      return 'h_' + (hash >>> 0).toString(16);
    }

    function showToast(message) {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `<span>${escapeHtml(message)}</span><button style="color:#C6FF45;font-weight:700;" aria-label="Close">×</button>`;
      el.querySelector('button').onclick = () => el.remove();
      root.appendChild(el);
      setTimeout(() => {
        if (el.parentNode) el.remove();
      }, 3600);
    }

    function playTimerChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0.12, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 0.36);
        });
      } catch (e) { /* AudioContext blocked or unsupported */ }
    }

    /* ==========================================================================
       3. DATA STORE, AUTH & SAMPLE DATA SEEDING
       ========================================================================== */
    function loadUsers() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_USERS_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveUsers(users) {
      localStorage.setItem(STORAGE_USERS_KEY, JSON.stringify(users));
    }

    function getSessionUserId() {
      return localStorage.getItem(STORAGE_SESSION_KEY);
    }

    function setSessionUserId(userId) {
      if (userId) localStorage.setItem(STORAGE_SESSION_KEY, userId);
      else localStorage.removeItem(STORAGE_SESSION_KEY);
    }

    function createInitialChaptersForExam(exam) {
      const subjects = EXAM_SUBJECTS[exam] || EXAM_SUBJECTS.NEET;
      const chapters = [];
      subjects.forEach((subj) => {
        (DEFAULT_SYLLABUS[subj] || []).forEach((title) => {
          chapters.push({
            id: uid('ch'),
            subject: subj,
            title,
            status: 'Not Started',
            progress: 0,
            deadline: '',
            notes: '',
            markedForRevision: false,
            revisions: { first: false, second: false, third: false },
            lastRevised: ''
          });
        });
      });
      return chapters;
    }

    function loadUserData(userId, exam) {
      try {
        const raw = localStorage.getItem(STORAGE_DATA_PREFIX + userId);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            chapters: parsed.chapters || [],
            tasks: parsed.tasks || [],
            sessions: parsed.sessions || [],
            mockTests: parsed.mockTests || [],
            notes: parsed.notes || []
          };
        }
      } catch (e) { /* fall back to fresh seed */ }

      const fresh = {
        chapters: createInitialChaptersForExam(exam),
        tasks: [],
        sessions: [],
        mockTests: [],
        notes: []
      };
      saveUserData(userId, fresh);
      return fresh;
    }

    function saveUserData(userId, data) {
      localStorage.setItem(STORAGE_DATA_PREFIX + userId, JSON.stringify(data));
    }

    function generateSampleData(exam) {
      const chapters = createInitialChaptersForExam(exam);
      const today = toLocalDateStr();
      const subjects = EXAM_SUBJECTS[exam];

        const mod = idx % 5;

          ch.status = 'Completed';
          ch.progress = 100;
          ch.revisions = { first: true, second: mod === 0, third: false };
          ch.lastRevised = addDays(today, -((idx % 6) + 1));
          ch.markedForRevision = mod === 1;
        } else if (mod === 2) {
          ch.status = 'In Progress';
          ch.progress = 55;
          ch.deadline = addDays(today, 4);
          ch.markedForRevision = true;

          subject: subjects[1],
          chapterId: chapters[13]?.id || '',
          date: today,
          time: '16:30',
          priority: 'High',
          deadline: today,
          completed: false,
          notes: 'Write summary sheet.'

          title: `Complete lecture notes & PYQs`,
          subject: subjects[2],
          chapterId: chapters[25]?.id || '',
          date: today,
          time: '19:30',
          priority: 'Medium',
          deadline: addDays(today, 1),
          completed: false,
          notes: ''

          id: uid('tsk'),

          time: '10:00',
          priority: 'High',
          deadline: addDays(today, 2),
          completed: false,
          notes: 'Analyze silly mistakes.'

      // 14 days of realistic sessions
      const sessions = [];
      const dayMins = [120, 150, 90, 180, 135, 210, 165, 140, 195, 110, 225, 175, 150, 95];
      dayMins.forEach((totalM, i) => {
        const d = addDays(today, -(13 - i));
        const subj = subjects[i % subjects.length];
        const subjCh = chapters.find(c => c.subject === subj);

          id: uid('ses'),
          date: d,
          timestamp: Date.now() - (13 - i) * 86400000,
          durationMinutes: Math.round(totalM * 0.6),
          subject: subj,
          chapterId: subjCh ? subjCh.id : '',
          mode: 'Pomodoro'
        });
        sessions.push({
          id: uid('ses'),
          date: d,
          timestamp: Date.now() - (13 - i) * 86400000 + 3600000,
          durationMinutes: Math.round(totalM * 0.4),
          subject: subjects[(i + 1) % subjects.length],
          chapterId: '',
          mode: 'Deep Focus'
        });
      });

      const totalMax = exam === 'NEET' ? 720 : 300;
      const mockTests = [
        {
          id: uid('tst'),
          name: `${exam} Foundation Test #1`,
          date: addDays(today, -21),
          type: 'Part Test',
          totalMarks: totalMax,
          obtainedMarks: exam === 'NEET' ? 512 : 168,
          accuracy: 76,
          mistakes: 18,
          subjectScores: exam === 'NEET'
            ? { Physics: 112, Chemistry: 128, Botany: 138, Zoology: 134 }
            : { Physics: 54, Chemistry: 62, Mathematics: 52 },
          notes: 'Need faster numerical calculation in Physics.'
        },
        {
          id: uid('tst'),
          name: `${exam} Cumulative Mock #2`,
          date: addDays(today, -12),
          type: 'Full Syllabus',
          totalMarks: totalMax,
          obtainedMarks: exam === 'NEET' ? 568 : 196,
          accuracy: 82,
          mistakes: 13,
          subjectScores: exam === 'NEET'
            ? { Physics: 128, Chemistry: 142, Botany: 150, Zoology: 148 }
            : { Physics: 64, Chemistry: 70, Mathematics: 62 },
          notes: 'Organic Chemistry accuracy improved noticeably.'
        },

    const appState = {
      screen: 'landing', // 'landing' | 'auth' | 'app'
      authMode: 'login', // 'login' | 'register'
      section: 'dashboard',
      user: null,
      data: null,

      notesTab: 'notes', // 'notes' | 'revision'

      notesSearch: '',
      // Analytics state
      analyticsRange: 14, // 7 | 14 | 30
      // Timer state
      timer: {
        mode: 'study', // 'study' | 'short' | 'long' | 'custom'
        customMinutes: 45,
        totalSeconds: 25 * 60,
        remainingSeconds: 25 * 60,
        running: false,
        endTimestamp: null,
        intervalId: null,
        subject: '',
        chapterId: ''
      }
    };

    function getModeMinutes(mode, customMin) {
      if (mode === 'study') return 25;
      if (mode === 'short') return 5;
      if (mode === 'long') return 15;
      return Math.max(1, Math.min(180, Number(customMin) || 45));
    }

    function setTimerMode(mode) {
      stopTimerInterval();
      const mins = getModeMinutes(mode, appState.timer.customMinutes);
      appState.timer.mode = mode;
      appState.timer.running = false;
      appState.timer.endTimestamp = null;
      appState.timer.totalSeconds = mins * 60;
      appState.timer.remainingSeconds = mins * 60;
      render();
    }

    function startTimer() {
      if (appState.timer.running) return;
      if (appState.timer.remainingSeconds <= 0) {
        const mins = getModeMinutes(appState.timer.mode, appState.timer.customMinutes);
        appState.timer.totalSeconds = mins * 60;
        appState.timer.remainingSeconds = mins * 60;
      }
      appState.timer.running = true;
      appState.timer.endTimestamp = Date.now() + appState.timer.remainingSeconds * 1000;
      appState.timer.intervalId = setInterval(tickTimer, 250);
      render();
    }

    function pauseTimer() {
      if (!appState.timer.running) return;
      const diff = Math.max(0, Math.ceil((appState.timer.endTimestamp - Date.now()) / 1000));
      appState.timer.remainingSeconds = diff;
      appState.timer.running = false;
      appState.timer.endTimestamp = null;
      stopTimerInterval();
      render();
    }

    function resetTimer() {
      stopTimerInterval();
      const mins = getModeMinutes(appState.timer.mode, appState.timer.customMinutes);
      appState.timer.running = false;
      appState.timer.endTimestamp = null;
      appState.timer.totalSeconds = mins * 60;
      appState.timer.remainingSeconds = mins * 60;
      render();
    }

    function stopTimerInterval() {
      if (appState.timer.intervalId) {
        clearInterval(appState.timer.intervalId);
        appState.timer.intervalId = null;
      }
    }

    function tickTimer() {
      if (!appState.timer.running || !appState.timer.endTimestamp) return;
      const diff = Math.max(0, Math.ceil((appState.timer.endTimestamp - Date.now()) / 1000));
      if (diff !== appState.timer.remainingSeconds) {
        appState.timer.remainingSeconds = diff;
        if (appState.section === 'timer') {
          updateTimerDomOnly();
        }
      }
      if (diff <= 0) {
        completeTimerSession(false);
      }
    }

    function updateTimerDomOnly() {
      const digitsEl = document.getElementById('timer-digits');
      const arcEl = document.getElementById('timer-arc');
      if (digitsEl) digitsEl.textContent = formatMMSS(appState.timer.remainingSeconds);
      if (arcEl) {
        const radius = 104;
        const circumference = 2 * Math.PI * radius;
        const pct = appState.timer.totalSeconds > 0
          ? (appState.timer.totalSeconds - appState.timer.remainingSeconds) / appState.timer.totalSeconds
          : 0;
        arcEl.setAttribute('stroke-dashoffset', String(circumference * (1 - pct)));
      }
      document.title = `${formatMMSS(appState.timer.remainingSeconds)} — TeachSaathi`;
    }

    function completeTimerSession(manualEarly = false) {
      stopTimerInterval();
      const elapsedSec = appState.timer.totalSeconds - appState.timer.remainingSeconds;
      const loggedMinutes = manualEarly
        ? Math.max(1, Math.round(elapsedSec / 60))
        : Math.round(appState.timer.totalSeconds / 60);

      appState.timer.running = false;
      appState.timer.endTimestamp = null;
      document.title = 'TeachSaathi — Your Preparation. Your Progress.';

      if (appState.user?.preferences?.timerSound) {
        playTimerChime();
      }

      const isStudyMode = appState.timer.mode === 'study' || appState.timer.mode === 'custom';
      if (isStudyMode && appState.user && appState.data) {
        const subjects = EXAM_SUBJECTS[appState.user.exam];
        const subj = appState.timer.subject || subjects[0];
        appState.data.sessions.push({
          id: uid('ses'),
          date: toLocalDateStr(),
          timestamp: Date.now(),
          durationMinutes: loggedMinutes,
          subject: subj,
          chapterId: appState.timer.chapterId || '',
          mode: appState.timer.mode === 'study' ? 'Pomodoro 25m' : `Custom ${loggedMinutes}m`
        });
        persistCurrentUserData();
        showToast(`Logged ${loggedMinutes}m focus session in ${subj}!`);
      } else {
        showToast('Break complete! Ready for your next focus block.');
      }

      const mins = getModeMinutes(appState.timer.mode, appState.timer.customMinutes);
      appState.timer.totalSeconds = mins * 60;
      appState.timer.remainingSeconds = mins * 60;
      render();
    }

    function formatMMSS(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function persistCurrentUserData() {
      if (appState.user && appState.data) {
        saveUserData(appState.user.id, appState.data);
      }
    }

    /* ==========================================================================
       5. DERIVED ANALYTICS & METRICS ENGINE (100% REAL USER DATA)
       ========================================================================== */
    function computeMetrics() {
      const user = appState.user;
      const data = appState.data;
      if (!user || !data) return {};
      const today = toLocalDateStr();
      const subjects = EXAM_SUBJECTS[user.exam];

      // Study hours
      const totalMins = data.sessions.reduce((s, x) => s + (Number(x.durationMinutes) || 0), 0);
      const todayMins = data.sessions
        .filter(x => x.date === today)
        .reduce((s, x) => s + (Number(x.durationMinutes) || 0), 0);

      // Daily totals map
      const dailyMinsMap = {};
      data.sessions.forEach(s => {
        dailyMinsMap[s.date] = (dailyMinsMap[s.date] || 0) + (Number(s.durationMinutes) || 0);
      });

      // Current streak (consecutive days with >= 1 min up to today, or up to yesterday if today has 0 yet)
      let streak = 0;
      let cursor = (dailyMinsMap[today] || 0) > 0 ? today : addDays(today, -1);
      while ((dailyMinsMap[cursor] || 0) > 0) {
        streak++;
        cursor = addDays(cursor, -1);
      }

      // Longest streak
      const activeDates = Object.keys(dailyMinsMap).filter(d => dailyMinsMap[d] > 0).sort();
      let longestStreak = 0;
      let run = 0;
      for (let i = 0; i < activeDates.length; i++) {
        if (i === 0 || addDays(activeDates[i - 1], 1) === activeDates[i]) {
          run++;
        } else {
          run = 1;
        }
        if (run > longestStreak) longestStreak = run;
      }

      // Chapters & Syllabus
      const totalChapters = data.chapters.length;
      const completedChapters = data.chapters.filter(c => c.status === 'Completed').length;
      const inProgressChapters = data.chapters.filter(c => c.status === 'In Progress').length;
      const syllabusPct = totalChapters > 0
        ? Math.round(data.chapters.reduce((sum, c) => sum + (Number(c.progress) || 0), 0) / totalChapters)
        : 0;

      // Subject stats
      const subjectStats = {};
      subjects.forEach(subj => {
        const chs = data.chapters.filter(c => c.subject === subj);
        const mins = data.sessions.filter(s => s.subject === subj).reduce((a, b) => a + (Number(b.durationMinutes) || 0), 0);
        const comp = chs.filter(c => c.status === 'Completed').length;
        const pct = chs.length > 0 ? Math.round(chs.reduce((a, b) => a + (Number(b.progress) || 0), 0) / chs.length) : 0;
        const testsWithSubj = data.mockTests.filter(t => t.subjectScores && t.subjectScores[subj] !== undefined);
        const avgSubjScore = testsWithSubj.length > 0
          ? Math.round(testsWithSubj.reduce((a, b) => a + Number(b.subjectScores[subj] || 0), 0) / testsWithSubj.length)
          : null;
        subjectStats[subj] = {
          totalChapters: chs.length,
          completedChapters: comp,
          inProgressChapters: chs.filter(c => c.status === 'In Progress').length,
          progressPct: pct,
          hours: +(mins / 60).toFixed(1),
          minutes: mins,
          avgSubjScore
        };
      });

      // Tasks
      const pendingTasks = data.tasks.filter(t => !t.completed);
      const todayTasks = data.tasks.filter(t => t.date === today);

      // Weekly 7 days
      const last7Days = [];
      let weeklyMins = 0;
      for (let i = 6; i >= 0; i--) {
        const d = addDays(today, -i);
        const mins = dailyMinsMap[d] || 0;
        weeklyMins += mins;
        const dt = new Date(d + 'T00:00:00');
        last7Days.push({
          date: d,
          label: dt.toLocaleDateString('en-IN', { weekday: 'short' }),
          hours: +(mins / 60).toFixed(2)
        });
      }

      // Mock tests
      const sortedTests = [...data.mockTests].sort((a, b) => a.date.localeCompare(b.date));
      const testPcts = sortedTests.map(t => t.totalMarks > 0 ? Math.round((t.obtainedMarks / t.totalMarks) * 100) : 0);
      const avgTestPct = testPcts.length ? Math.round(testPcts.reduce((a, b) => a + b, 0) / testPcts.length) : 0;
      const highestTest = sortedTests.reduce((best, t) => (!best || (t.obtainedMarks / t.totalMarks) > (best.obtainedMarks / best.totalMarks) ? t : best), null);
      const improvement = testPcts.length >= 2 ? (testPcts[testPcts.length - 1] - testPcts[0]) : 0;

      // Best single day
      const bestDayMins = Object.values(dailyMinsMap).reduce((m, v) => Math.max(m, v), 0);

      // Notifications
      const notifications = [];
      const overdue = pendingTasks.filter(t => t.deadline && t.deadline < today);
      if (overdue.length > 0) {
        notifications.push({ id: 'n_overdue', title: `${overdue.length} overdue task(s)`, desc: 'Review your planner deadlines.', section: 'planner' });
      }
      const dueRev = data.chapters.filter(c => c.markedForRevision);
      if (dueRev.length > 0) {
        notifications.push({ id: 'n_rev', title: `${dueRev.length} chapter(s) marked for revision`, desc: 'Open Notes & Revision to log a pass.', section: 'notes' });
      }
      if (todayMins === 0) {
        notifications.push({ id: 'n_today', title: 'No study session logged today', desc: 'Start a 25m Pomodoro block to build momentum.', section: 'timer' });
      }
      if (streak >= 3) {
        notifications.push({ id: 'n_streak', title: `${streak}-day active study streak`, desc: 'Stay consistent to hit your weekly target.', section: 'achievements' });
      }

      return {
        today,
        totalHours: +(totalMins / 60).toFixed(1),
        todayHours: +(todayMins / 60).toFixed(1),
        todayMins,
        weeklyHours: +(weeklyMins / 60).toFixed(1),
        streak,
        longestStreak,
        totalChapters,
        completedChapters,
        inProgressChapters,
        syllabusPct,
        subjectStats,
        pendingTasks,
        todayTasks,
        last7Days,
        dailyMinsMap,
        sortedTests,
        avgTestPct,
        highestTest,
        improvement,
        bestDayHours: +(bestDayMins / 60).toFixed(1),
        notifications
      };
    }

    /* ==========================================================================
       6. FLAT 2D SVG CHART BUILDERS
       ========================================================================== */
    function renderBarChartSvg(items, targetValue = null, height = 190) {
      if (!items.length) return '';
      const maxVal = Math.max(targetValue || 0, ...items.map(i => i.value), 1);
      const w = 520;
      const padL = 34;
      const padB = 26;
      const padT = 16;
      const chartW = w - padL - 12;
      const chartH = height - padT - padB;
      const barStep = chartW / items.length;
      const barW = Math.min(34, barStep * 0.58);

      let targetLine = '';
      if (targetValue && targetValue > 0) {
        const ty = padT + chartH - (targetValue / maxVal) * chartH;
        targetLine = `
          <line x1="${padL}" y1="${ty}" x2="${w - 8}" y2="${ty}" stroke="#650D25" stroke-dasharray="4 4" stroke-width="1.2" opacity="0.6"/>
          <text x="${w - 10}" y="${ty - 4}" text-anchor="end" font-size="10" fill="#650D25" font-weight="600">Goal ${targetValue}h</text>
        `;
      }

      const gridLines = [0, 0.5, 1].map(frac => {
        const y = padT + chartH * (1 - frac);
        const val = (maxVal * frac).toFixed(1).replace(/\.0$/, '');
        return `
          <line x1="${padL}" y1="${y}" x2="${w - 8}" y2="${y}" stroke="#E5E1E3" stroke-width="1"/>
          <text x="${padL - 6}" y="${y + 3}" text-anchor="end" font-size="10" fill="#666163">${val}</text>
        `;
      }).join('');

      const bars = items.map((item, idx) => {
        const barH = Math.max(2, (item.value / maxVal) * chartH);
        const x = padL + idx * barStep + (barStep - barW) / 2;
        const y = padT + chartH - barH;
        const fill = item.highlight ? '#C6FF45' : '#650D25';
        const stroke = item.highlight ? '#3D0919' : 'none';
        return `
          <g>
            <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="1">
              <title>${escapeHtml(item.label)}: ${item.value}h</title>
            </rect>
            <text x="${x + barW / 2}" y="${height - 8}" text-anchor="middle" font-size="10" fill="#666163">${escapeHtml(item.label)}</text>
          </g>
        `;
      }).join('');

      return `
        <svg viewBox="0 0 ${w} ${height}" width="100%" height="${height}" style="display:block;">
          ${gridLines}
          ${targetLine}
          ${bars}
        </svg>
      `;
    }

    function renderLineChartSvg(points, height = 190) {
      if (!points.length) return '';
      const w = 520;
      const padL = 36;
      const padR = 16;
      const padT = 18;
      const padB = 28;
      const chartW = w - padL - padR;
      const chartH = height - padT - padB;
      const maxVal = 100;

      const grid = [0, 25, 50, 75, 100].map(v => {
        const y = padT + chartH - (v / maxVal) * chartH;
        return `
          <line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="#E5E1E3" stroke-width="1"/>
          <text x="${padL - 6}" y="${y + 3}" text-anchor="end" font-size="10" fill="#666163">${v}%</text>
        `;
      }).join('');

      const coords = points.map((pt, i) => {
        const x = points.length === 1 ? padL + chartW / 2 : padL + (i / (points.length - 1)) * chartW;
        const y = padT + chartH - (Math.min(100, Math.max(0, pt.value)) / maxVal) * chartH;
        return { x, y, ...pt };
      });

      const poly = coords.map(c => `${c.x},${c.y}`).join(' ');
      const dots = coords.map(c => `
        <g>
          <circle cx="${c.x}" cy="${c.y}" r="5" fill="#C6FF45" stroke="#650D25" stroke-width="2">
            <title>${escapeHtml(c.label)}: ${c.value}%</title>
          </circle>
          <text x="${c.x}" y="${c.y - 9}" text-anchor="middle" font-size="10" font-weight="700" fill="#3D0919">${c.value}%</text>
          <text x="${c.x}" y="${height - 8}" text-anchor="middle" font-size="10" fill="#666163">${escapeHtml(c.shortLabel)}</text>
        </g>
      `).join('');

      return `
        <svg viewBox="0 0 ${w} ${height}" width="100%" height="${height}" style="display:block;">
          ${grid}
          ${coords.length > 1 ? `<polyline fill="none" stroke="#650D25" stroke-width="2.5" points="${poly}"/>` : ''}
          ${dots}
        </svg>
      `;
    }

    /* ==========================================================================
       10. AUTHENTICATED APP SHELL & SECTION VIEWS

    function renderAppShell() {
      const user = appState.user;
      const metrics = computeMetrics();
      const initials = user.name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
      const unreadCount = metrics.notifications.filter(n => !appState.readNotifIds.has(n.id)).length;

      let sectionHtml = '';
      switch (appState.section) {
        case 'dashboard': sectionHtml = renderDashboardSection(metrics); break;
        case 'planner': sectionHtml = renderPlannerSection(metrics); break;
        case 'timer': sectionHtml = renderTimerSection(metrics); break;
        case 'subjects': sectionHtml = renderSubjectsSection(metrics); break;
        case 'syllabus': sectionHtml = renderSyllabusSection(metrics); break;
        case 'tests': sectionHtml = renderMockTestsSection(metrics); break;
        case 'notes': sectionHtml = renderNotesSection(metrics); break;
        case 'analytics': sectionHtml = renderAnalyticsSection(metrics); break;
        case 'achievements': sectionHtml = renderAchievementsSection(metrics); break;
        case 'settings': sectionHtml = renderSettingsSection(metrics); break;
        default: sectionHtml = renderDashboardSection(metrics);
      }

      return `
        <div class="app-shell">
          <div class="sidebar-overlay ${appState.mobileSidebarOpen ? 'open' : ''}" id="sidebar-overlay"></div>
          <aside class="sidebar ${appState.mobileSidebarOpen ? 'open' : ''}" aria-label="Main Navigation">
            <div class="sidebar-header">
              ${logoSvg(true, true)}
              <span class="badge badge-lime" style="font-size:0.7rem;">${escapeHtml(user.exam)} ${escapeHtml(user.targetYear)}</span>
            </div>
            <nav class="sidebar-nav">
              ${NAV_ITEMS.map(item => `
                <button class="nav-item ${appState.section === item.id ? 'active' : ''}" data-action="nav" data-section="${item.id}">
                  <span style="color:${appState.section === item.id ? 'var(--lime)' : 'rgba(255,255,255,0.85)'};display:inline-flex;">${iconSvg(item.icon, 17)}</span>
                  <span>${item.label}</span>
                </button>
              `).join('')}
            </nav>
            <div class="sidebar-footer">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span>Daily Goal</span>
                <strong style="color:var(--lime);" class="tabular">${metrics.todayHours} / ${user.dailyGoalHours}h</strong>
              </div>
              <div class="progress-track" style="height:6px;background:rgba(255,255,255,0.16);border:none;margin-bottom:10px;">
                <div class="progress-fill progress-fill-lime" style="width:${Math.min(100, Math.round((metrics.todayHours / Math.max(1, user.dailyGoalHours)) * 100))}%;"></div>
              </div>
              <div style="font-size:0.7rem;opacity:0.78;">Local Browser Storage Active</div>
            </div>
          </aside>

          <div class="main-wrapper">
            <header class="topbar">
              <div class="topbar-left">
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Menu">${iconSvg('menu', 18)}</button>
                <div class="topbar-search">
                  <span class="topbar-search-icon">${iconSvg('search', 15)}</span>
                  <input class="topbar-search-input" id="global-search-input" type="search" placeholder="Search chapters, tasks, notes, tests..." value="${escapeHtml(appState.searchQuery)}" />
                  <div id="global-search-results"></div>
                </div>
              </div>
              <div class="topbar-right">
                ${appState.timer.running ? `
                  <button class="btn btn-lime btn-sm tabular" data-action="nav" data-section="timer">
                    ${iconSvg('clock', 14)} ${formatMMSS(appState.timer.remainingSeconds)}
                  </button>
                ` : ''}
                <div style="position:relative;">
                  <button class="icon-btn" id="notif-toggle-btn" aria-label="Notifications">
                    ${iconSvg('bell', 17)}
                    ${unreadCount > 0 ? '<span class="notif-dot"></span>' : ''}

                  ${appState.notifOpen ? renderNotificationsPopover(metrics) : ''}
                </div>
                <button class="profile-pill" data-action="nav" data-section="settings" title="Profile & Settings">
                  <span class="avatar">${escapeHtml(initials)}</span>

    function renderNotificationsPopover(metrics) {
      const notifs = metrics.notifications;
      return `

            <button class="btn btn-ghost btn-sm" data-action="mark-notifs-read" style="font-size:0.75rem;">Mark all read</button>
          </div>
          ${notifs.length === 0 ? `<div class="muted" style="font-size:0.8rem;padding:12px 0;text-align:center;">All caught up for today.</div>` :

              <button data-action="nav" data-section="${n.section}" style="width:100%;text-align:left;padding:8px;border-radius:6px;margin-bottom:4px;border:1px solid ${appState.readNotifIds.has(n.id) ? 'transparent' : 'var(--border)'};background:${appState.readNotifIds.has(n.id) ? 'transparent' : 'var(--soft-grey)'};">
                <div style="font-size:0.8rem;font-weight:700;color:var(--charcoal);">${escapeHtml(n.title)}</div>
                <div class="muted" style="font-size:0.75rem;">${escapeHtml(n.desc)}</div>
              </button>
            `).join('')
          }
        </div>
      `;

    /* --------------------------------------------------------------------------
       SECTION 1: MAIN DASHBOARD
       -------------------------------------------------------------------------- */
    function renderDashboardSection(m) {
      const user = appState.user;
      const hr = new Date().getHours();
      const greeting = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
      const formattedDate = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      const quote = MOTIVATIONAL_QUOTES[new Date().getDate() % MOTIVATIONAL_QUOTES.length];
      const goalPct = Math.min(100, Math.round((m.todayHours / Math.max(0.5, user.dailyGoalHours)) * 100));
      const subjects = EXAM_SUBJECTS[user.exam];

      const todayPending = m.todayTasks.filter(t => !t.completed);
      const todayDone = m.todayTasks.filter(t => t.completed);

      return `
        <div class="welcome-banner">
          <div>
            <div style="font-size:0.8rem;font-weight:600;color:var(--muted);margin-bottom:4px;">${formattedDate} &bull; ${escapeHtml(user.exam)} ${escapeHtml(user.targetYear)}</div>
            <h1 class="page-title">${greeting}, ${escapeHtml(user.name)}</h1>
            <p class="muted" style="font-size:0.875rem;margin-top:4px;">"${quote}"</p>
          </div>
          <div style="min-width:240px;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:12px 16px;">
            <div style="display:flex;justify-content:space-between;font-size:0.8rem;font-weight:700;margin-bottom:6px;">
              <span style="color:var(--maroon);">Daily Study Goal</span>
              <span class="tabular">${m.todayHours}h / ${user.dailyGoalHours}h (${goalPct}%)</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill ${goalPct >= 100 ? 'progress-fill-lime' : ''}" style="width:${goalPct}%;"></div>
            </div>
          </div>
        </div>

        <!-- 6 STATS CARDS -->
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-label">Total Study Hours</span>
            <span class="stat-value tabular">${m.totalHours}h</span>
            <span class="stat-foot">${appState.data.sessions.length} logged sessions</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Today's Study</span>
            <span class="stat-value tabular">${m.todayHours}h</span>
            <span class="stat-foot">Goal: ${user.dailyGoalHours}h/day</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Study Streak</span>
            <span class="stat-value tabular">${m.streak}d</span>
            <span class="stat-foot">Best: ${m.longestStreak} days</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Syllabus Done</span>
            <span class="stat-value tabular">${m.syllabusPct}%</span>
            <span class="stat-foot">Overall completion</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Chapters Done</span>
            <span class="stat-value tabular">${m.completedChapters}/${m.totalChapters}</span>
            <span class="stat-foot">${m.inProgressChapters} in progress</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Pending Tasks</span>
            <span class="stat-value tabular">${m.pendingTasks.length}</span>
            <span class="stat-foot">${todayPending.length} due today</span>
          </div>
        </div>

        <!-- QUICK ACTIONS -->
        <div class="quick-actions-row">
          <button class="btn btn-lime" data-action="nav" data-section="timer">${iconSvg('play', 15)} Start Studying</button>
          <button class="btn btn-maroon" data-action="open-task-modal">${iconSvg('plus', 15)} Add Task</button>
          <button class="btn btn-outline" data-action="nav" data-section="syllabus">${iconSvg('checkSquare', 15)} Track Chapter</button>
          <button class="btn btn-outline" data-action="open-test-modal">${iconSvg('barChart', 15)} Add Mock Test</button>
          <button class="btn btn-outline" data-action="open-note-modal">${iconSvg('fileText', 15)} Write Notes</button>
        </div>

        <!-- PROGRESS & CHARTS -->
        <div class="dashboard-grid">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <div>
                <h2 class="section-title">Weekly Study Hours</h2>
                <div class="muted" style="font-size:0.8rem;">Last 7 days compared against ${user.dailyGoalHours}h target</div>
              </div>
              <span class="badge badge-grey tabular">${m.weeklyHours}h this week</span>
            </div>
            ${renderBarChartSvg(m.last7Days.map(d => ({
              label: d.label,
              value: d.hours,
              highlight: d.hours >= user.dailyGoalHours
            })), user.dailyGoalHours, 195)}
          </div>

          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <h2 class="section-title">Subject Progress</h2>
              <button class="btn btn-ghost btn-sm" data-action="nav" data-section="subjects">View All &rarr;</button>
            </div>
            <div style="display:flex;flex-direction:column;gap:14px;">
              ${subjects.map(subj => {
                const st = m.subjectStats[subj];
                return `
                  <div>
                    <div style="display:flex;justify-content:space-between;font-size:0.825rem;margin-bottom:5px;">
                      <strong>${escapeHtml(subj)}</strong>
                      <span class="muted tabular">${st.completedChapters}/${st.totalChapters} ch &bull; <strong>${st.progressPct}%</strong></span>
                    </div>
                    <div class="progress-track">
                      <div class="progress-fill" style="width:${st.progressPct}%;background:${SUBJECT_COLORS[subj] || 'var(--maroon)'};"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
            <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:0.8rem;font-weight:600;">Overall Syllabus Completion</span>
              <span class="badge badge-maroon tabular">${m.syllabusPct}%</span>
            </div>
          </div>
        </div>

        <!-- TODAY'S SCHEDULE -->
        <div class="grid-2">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <h2 class="section-title">Today's Pending Tasks (${todayPending.length})</h2>
              <button class="btn btn-ghost btn-sm" data-action="nav" data-section="planner">Planner &rarr;</button>
            </div>
            ${todayPending.length === 0 ? `
              <div class="empty-state" style="padding:24px;">
                <div class="muted" style="font-size:0.875rem;margin-bottom:10px;">No pending tasks scheduled for today.</div>
                <button class="btn btn-outline btn-sm" data-action="open-task-modal">+ Schedule Study Task</button>
              </div>
            ` : `
              <div style="display:flex;flex-direction:column;gap:8px;">
                ${todayPending.map(t => `
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;">
                    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;">
                      <input type="checkbox" data-action="toggle-task" data-id="${t.id}" />
                      <div>
                        <div style="font-size:0.875rem;font-weight:600;">${escapeHtml(t.title)}</div>
                        <div class="muted" style="font-size:0.75rem;">${escapeHtml(t.subject)} ${t.time ? '&bull; ' + escapeHtml(t.time) : ''}</div>
                      </div>
                    </label>
                    <span class="badge ${t.priority === 'High' ? 'badge-danger' : t.priority === 'Medium' ? 'badge-warning' : 'badge-grey'}">${escapeHtml(t.priority)}</span>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <h2 class="section-title">Completed Today (${todayDone.length})</h2>
              <span class="badge badge-lime">${m.todayHours}h focused</span>
            </div>
            ${todayDone.length === 0 ? `
              <div class="empty-state" style="padding:24px;">
                <div class="muted" style="font-size:0.875rem;">Completed tasks for today will appear here.</div>
              </div>
            ` : `
              <div style="display:flex;flex-direction:column;gap:8px;">
                ${todayDone.map(t => `
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--soft-grey);border:1px solid var(--border);border-radius:6px;">
                    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;">
                      <input type="checkbox" checked data-action="toggle-task" data-id="${t.id}" />
                      <span style="font-size:0.875rem;text-decoration:line-through;color:var(--muted);">${escapeHtml(t.title)}</span>
                    </label>
                    <span class="badge badge-success">Done</span>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    /* --------------------------------------------------------------------------
       SECTION 2: STUDY PLANNER (DAILY / WEEKLY / CALENDAR / TIMELINE)
       -------------------------------------------------------------------------- */
    function renderPlannerSection(m) {
      const subjects = EXAM_SUBJECTS[appState.user.exam];
      const allTasks = appState.data.tasks.filter(t =>
        appState.plannerFilterSubject === 'All' || t.subject === appState.plannerFilterSubject
      );

      let viewHtml = '';
      if (appState.plannerView === 'daily') {
        const dayTasks = allTasks.filter(t => t.date === appState.plannerDate).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
        viewHtml = `
          <div class="card">
            <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <button class="btn btn-outline btn-sm" data-action="planner-shift-day" data-delta="-1">${iconSvg('chevronLeft', 15)}</button>
                <input type="date" class="input" id="planner-date-picker" value="${appState.plannerDate}" style="width:auto;" />
                <button class="btn btn-outline btn-sm" data-action="planner-shift-day" data-delta="1">${iconSvg('chevronRight', 15)}</button>
                <button class="btn btn-ghost btn-sm" data-action="planner-today">Today</button>
              </div>
              <span class="muted" style="font-size:0.85rem;">${dayTasks.length} task(s) on ${formatDisplayDate(appState.plannerDate)}</span>
            </div>
            ${dayTasks.length === 0 ? `
              <div class="empty-state">
                <p class="muted" style="margin-bottom:12px;">No study tasks scheduled for ${formatDisplayDate(appState.plannerDate)}.</p>
                <button class="btn btn-lime btn-sm" data-action="open-task-modal" data-date="${appState.plannerDate}">+ Add Task for This Day</button>
              </div>
            ` : renderTasksTable(dayTasks)}
          </div>
        `;
      } else if (appState.plannerView === 'weekly') {
        const baseDt = new Date(appState.plannerDate + 'T00:00:00');
        const dayIdx = (baseDt.getDay() + 6) % 7; // Monday = 0
        const mondayStr = addDays(appState.plannerDate, -dayIdx);
        const days = Array.from({ length: 7 }, (_, i) => addDays(mondayStr, i));
        viewHtml = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div style="display:flex;gap:8px;align-items:center;">
              <button class="btn btn-outline btn-sm" data-action="planner-shift-day" data-delta="-7">&larr; Prev Week</button>
              <strong style="color:var(--maroon);font-size:0.9rem;">Week of ${formatDisplayDate(mondayStr)}</strong>
              <button class="btn btn-outline btn-sm" data-action="planner-shift-day" data-delta="7">Next Week &rarr;</button>
            </div>
          </div>
          <div class="week-grid">
            ${days.map(dStr => {
              const dt = new Date(dStr + 'T00:00:00');
              const dTasks = allTasks.filter(t => t.date === dStr);
              const isToday = dStr === m.today;
              return `
                <div class="week-col">
                  <div class="week-col-head ${isToday ? 'today' : ''}">
                    <span>${dt.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric' })}</span>
                    <button class="btn btn-sm" style="padding:2px 6px;color:inherit;" data-action="open-task-modal" data-date="${dStr}" title="Add task">+</button>
                  </div>
                  <div style="padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;">
                    ${dTasks.length === 0 ? `<div class="muted" style="font-size:0.75rem;padding:8px;text-align:center;">Free</div>` :
                      dTasks.map(t => `
                        <div style="padding:7px 8px;border:1px solid var(--border);border-radius:5px;background:${t.completed ? 'var(--soft-grey)' : 'var(--white)'};font-size:0.78rem;">
                          <div style="display:flex;align-items:flex-start;gap:6px;">
                            <input type="checkbox" ${t.completed ? 'checked' : ''} data-action="toggle-task" data-id="${t.id}" style="margin-top:2px;" />
                            <div style="flex:1;min-width:0;">
                              <div style="font-weight:600;${t.completed ? 'text-decoration:line-through;color:var(--muted);' : ''}">${escapeHtml(t.title)}</div>
                              <div class="muted" style="font-size:0.7rem;">${escapeHtml(t.subject)} ${t.time ? '&bull; ' + escapeHtml(t.time) : ''}</div>
                            </div>
                          </div>
                        </div>
                      `).join('')
                    }
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (appState.plannerView === 'calendar') {
        const [yr, mo] = appState.plannerDate.split('-').map(Number);
        const firstDay = new Date(yr, mo - 1, 1);
        const startOffset = (firstDay.getDay() + 6) % 7;
        const daysInMonth = new Date(yr, mo, 0).getDate();
        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          cells.push(`${yr}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
        }
        const selectedDayTasks = allTasks.filter(t => t.date === appState.plannerDate);

        viewHtml = `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <strong style="color:var(--maroon);font-size:1rem;">${firstDay.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</strong>
              <div style="display:flex;gap:8px;">
                <button class="btn btn-outline btn-sm" data-action="planner-shift-day" data-delta="-30">&larr; Prev</button>
                <button class="btn btn-outline btn-sm" data-action="planner-shift-day" data-delta="30">Next &rarr;</button>
              </div>
            </div>
            <div class="calendar-grid">
              ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(w => `<div class="cal-head-cell">${w}</div>`).join('')}
              ${cells.map(cDate => {
                if (!cDate) return `<div class="cal-cell" style="background:var(--soft-grey);cursor:default;"></div>`;
                const dayNum = Number(cDate.split('-')[2]);
                const cTasks = allTasks.filter(t => t.date === cDate);
                return `
                  <div class="cal-cell ${cDate === appState.plannerDate ? 'selected' : ''}" data-action="select-planner-date" data-date="${cDate}">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                      <span style="font-size:0.78rem;font-weight:${cDate === m.today ? '800' : '600'};color:${cDate === m.today ? 'var(--maroon)' : 'var(--charcoal)'};">${dayNum}</span>
                      ${cTasks.length > 0 ? `<span class="badge badge-grey" style="padding:1px 6px;font-size:0.65rem;">${cTasks.length}</span>` : ''}
                    </div>
                    ${cTasks.slice(0, 2).map(t => `
                      <div style="font-size:0.7rem;padding:2px 4px;margin-bottom:2px;border-radius:3px;background:${t.completed ? 'var(--soft-grey)' : 'var(--maroon)'};color:${t.completed ? 'var(--muted)' : 'var(--white)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                        ${escapeHtml(t.title)}
                      </div>
                    `).join('')}
                  </div>
                `;
              }).join('')}
            </div>
            <div style="margin-top:16px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <strong style="color:var(--maroon);">Tasks on ${formatDisplayDate(appState.plannerDate)}</strong>
                <button class="btn btn-lime btn-sm" data-action="open-task-modal" data-date="${appState.plannerDate}">+ Add on This Date</button>
              </div>
              ${selectedDayTasks.length ? renderTasksTable(selectedDayTasks) : '<div class="muted" style="font-size:0.85rem;">No tasks on selected date.</div>'}
            </div>
          </div>
        `;
      } else {
        // Timeline view
        const dayTasks = allTasks.filter(t => t.date === appState.plannerDate);
        const hours = Array.from({ length: 18 }, (_, i) => i + 6); // 06:00 - 23:00
        viewHtml = `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <strong style="color:var(--maroon);">Hourly Study Timeline — ${formatDisplayDate(appState.plannerDate)}</strong>
              <input type="date" class="input" id="planner-date-picker" value="${appState.plannerDate}" style="width:auto;" />
            </div>
            <div style="border:1px solid var(--border);border-radius:6px;overflow:hidden;">
              ${hours.map(h => {
                const hh = String(h).padStart(2, '0');
                const slotTasks = dayTasks.filter(t => (t.time || '09:00').startsWith(hh));
                return `
                  <div style="display:grid;grid-template-columns:80px 1fr;border-bottom:1px solid var(--border);min-height:46px;">
                    <div class="tabular" style="padding:10px;background:var(--soft-grey);border-right:1px solid var(--border);font-size:0.78rem;font-weight:600;color:var(--muted);">${hh}:00</div>
                    <div style="padding:6px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
                      ${slotTasks.map(t => `
                        <div style="display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:5px;background:${t.completed ? 'var(--soft-grey)' : 'var(--maroon)'};color:${t.completed ? 'var(--charcoal)' : 'var(--white)'};font-size:0.8rem;">
                          <input type="checkbox" ${t.completed ? 'checked' : ''} data-action="toggle-task" data-id="${t.id}" />
                          <span>${escapeHtml(t.title)} (${escapeHtml(t.subject)})</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      return `
        <div class="page-header">
          <div>
            <h1 class="page-title">Study Planner</h1>
            <p class="page-subtitle">Organize daily targets, coaching revisions, and weekly practice blocks.</p>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
            <select class="select" id="planner-subject-filter" style="width:auto;">
              <option value="All">All Subjects</option>
              ${subjects.map(s => `<option value="${s}" ${appState.plannerFilterSubject === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
            <div class="tabs-bar">
              ${['daily', 'weekly', 'calendar', 'timeline'].map(v => `
                <button class="tab-btn ${appState.plannerView === v ? 'active' : ''}" data-action="set-planner-view" data-view="${v}">
                  ${v.charAt(0).toUpperCase() + v.slice(1)}
                </button>
              `).join('')}
            </div>
            <button class="btn btn-lime" data-action="open-task-modal">${iconSvg('plus', 15)} New Task</button>
          </div>
        </div>
        ${viewHtml}
      `;
    }

    function renderTasksTable(tasks) {
      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:40px;">Done</th>
                <th>Task</th>
                <th>Subject</th>
                <th>Time</th>
                <th>Priority</th>
                <th>Deadline</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody>
              ${tasks.map(t => `
                <tr>
                  <td><input type="checkbox" ${t.completed ? 'checked' : ''} data-action="toggle-task" data-id="${t.id}" /></td>
                  <td>
                    <div style="font-weight:600;${t.completed ? 'text-decoration:line-through;color:var(--muted);' : ''}">${escapeHtml(t.title)}</div>
                    ${t.notes ? `<div class="muted" style="font-size:0.75rem;">${escapeHtml(t.notes)}</div>` : ''}
                  </td>
                  <td><span class="badge badge-grey">${escapeHtml(t.subject)}</span></td>
                  <td class="tabular">${escapeHtml(t.time || '—')}</td>
                  <td><span class="badge ${t.priority === 'High' ? 'badge-danger' : t.priority === 'Medium' ? 'badge-warning' : 'badge-grey'}">${escapeHtml(t.priority)}</span></td>
                  <td class="tabular">${formatDisplayDate(t.deadline)}</td>
                  <td style="text-align:right;">
                    <button class="btn btn-ghost btn-sm" data-action="edit-task" data-id="${t.id}" aria-label="Edit">${iconSvg('edit', 14)}</button>
                    <button class="btn btn-ghost btn-sm" data-action="delete-task" data-id="${t.id}" aria-label="Delete" style="color:var(--danger);">${iconSvg('trash', 14)}</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    /* --------------------------------------------------------------------------
       SECTION 3: FOCUS TIMER (POMODORO)
       -------------------------------------------------------------------------- */
    function renderTimerSection(m) {
      const subjects = EXAM_SUBJECTS[appState.user.exam];
      if (!appState.timer.subject) appState.timer.subject = subjects[0];
      const subjChapters = appState.data.chapters.filter(c => c.subject === appState.timer.subject);

      const radius = 104;
      const circumference = 2 * Math.PI * radius;
      const pct = appState.timer.totalSeconds > 0
        ? (appState.timer.totalSeconds - appState.timer.remainingSeconds) / appState.timer.totalSeconds
        : 0;
      const dashOffset = circumference * (1 - pct);

      const recentSessions = [...appState.data.sessions].sort((a, b) => b.timestamp - a.timestamp).slice(0, 8);
      const elapsedMinutes = Math.floor((appState.timer.totalSeconds - appState.timer.remainingSeconds) / 60);

      return `
        <div class="page-header">
          <div>
            <h1 class="page-title">Focus Timer</h1>
            <p class="page-subtitle">Stay in deep work. Completed focus blocks automatically update your analytics and streaks.</p>
          </div>
          <div style="display:flex;gap:10px;">
            <span class="badge badge-grey tabular">Today: ${m.todayHours}h</span>
            <span class="badge badge-maroon tabular">This Week: ${m.weeklyHours}h</span>
          </div>
        </div>

        <div class="timer-layout">
          <div class="card" style="text-align:center;">
            <div class="tabs-bar" style="margin-bottom:16px;">
              <button class="tab-btn ${appState.timer.mode === 'study' ? 'active' : ''}" data-action="timer-mode" data-mode="study">Pomodoro 25m</button>
              <button class="tab-btn ${appState.timer.mode === 'short' ? 'active' : ''}" data-action="timer-mode" data-mode="short">Short Break 5m</button>
              <button class="tab-btn ${appState.timer.mode === 'long' ? 'active' : ''}" data-action="timer-mode" data-mode="long">Long Break 15m</button>
              <button class="tab-btn ${appState.timer.mode === 'custom' ? 'active' : ''}" data-action="timer-mode" data-mode="custom">Custom</button>
            </div>

            ${appState.timer.mode === 'custom' ? `
              <div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:8px;">
                <label class="form-label" for="custom-timer-mins" style="margin:0;">Minutes:</label>
                <input class="input" id="custom-timer-mins" type="number" min="1" max="180" value="${appState.timer.customMinutes}" style="width:90px;" ${appState.timer.running ? 'disabled' : ''} />
                <button class="btn btn-outline btn-sm" data-action="apply-custom-timer" ${appState.timer.running ? 'disabled' : ''}>Set</button>
              </div>
            ` : ''}

            <div class="timer-circle-wrap">
              <svg width="240" height="240" viewBox="0 0 240 240">
                <circle cx="120" cy="120" r="${radius}" fill="none" stroke="#F3F1F2" stroke-width="12"/>
                <circle cx="120" cy="120" r="${radius}" fill="none" stroke="#650D25" stroke-width="12" stroke-opacity="0.16"/>
                <circle id="timer-arc" cx="120" cy="120" r="${radius}" fill="none"
                  stroke="${appState.timer.mode === 'short' || appState.timer.mode === 'long' ? '#650D25' : '#C6FF45'}"
                  stroke-width="12" stroke-linecap="round"
                  stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}"
                  transform="rotate(-90 120 120)"/>
              </svg>
              <div class="timer-readout">
                <div id="timer-digits" class="timer-digits tabular">${formatMMSS(appState.timer.remainingSeconds)}</div>
                <div class="muted" style="font-size:0.78rem;font-weight:600;margin-top:6px;">
                  ${appState.timer.mode === 'short' ? 'SHORT BREAK' : appState.timer.mode === 'long' ? 'LONG BREAK' : escapeHtml(appState.timer.subject).toUpperCase()}
                </div>
              </div>
            </div>

            <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;">
              ${!appState.timer.running ? `
                <button class="btn btn-lime btn-lg" data-action="timer-start">${iconSvg('play', 16)} ${appState.timer.remainingSeconds < appState.timer.totalSeconds ? 'Resume' : 'Start Focus'}</button>
              ` : `
                <button class="btn btn-maroon btn-lg" data-action="timer-pause">${iconSvg('pause', 16)} Pause</button>
              `}
              <button class="btn btn-outline" data-action="timer-reset">${iconSvg('rotateCcw', 16)} Reset</button>




<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeachSaathi — Your Preparation. Your Progress.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       TEACHSAATHI DESIGN SYSTEM — FLAT 2D INTERNATIONAL EDTECH SAAS
       60% Pure & Cloud White (#FFFFFF / #F7F8FC) | 25% Midnight Navy (#17243A)
       10% Royal Blue (#4966E9) & Periwinkle (#E9EEFF) | 5% Mint Green (#B8F2D0)
       ========================================================================== */
    :root {
      --navy: #17243A;
      --navy-hover: #21324F;
      --royal: #4966E9;
      --royal-hover: #3855D6;
      --cloud: #F7F8FC;
      --white: #FFFFFF;
      --periwinkle: #E9EEFF;
      --periwinkle-border: #D2DCFF;
      --mint: #B8F2D0;
      --mint-strong: #27AE60;
      --mint-text: #0F5132;
      --slate: #687386;
      --dark-text: #202B3C;
      --border: #E4E8F2;
      --border-strong: #CFD6E6;
      --danger: #C81E1E;
      --danger-bg: #FEF2F2;
      --danger-border: #FECACA;
      --warning: #9A5B00;
      --warning-bg: #FFFBEB;
      --warning-border: #FDE68A;
      --shadow-xs: 0 1px 2px rgba(23, 36, 58, 0.04);
      --shadow-sm: 0 4px 14px rgba(23, 36, 58, 0.05);
      --shadow-md: 0 12px 30px rgba(23, 36, 58, 0.08);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --sidebar-w: 256px;
      --topbar-h: 64px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: var(--font-sans);
      background-color: var(--cloud);
      color: var(--dark-text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, .display-font { font-family: var(--font-display); letter-spacing: -0.02em; }
    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; }
    a { color: inherit; text-decoration: none; }
    .tabular { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    :focus-visible { outline: 2px solid var(--royal); outline-offset: 2px; }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .page-enter { animation: fadeSlideUp 0.22s var(--ease) both; }

    /* Top loading indicator */
    .top-loader {
      position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 200;
      background: var(--periwinkle); overflow: hidden; opacity: 0; pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .top-loader.active { opacity: 1; }
    .top-loader-bar {
      width: 40%; height: 100%; background: var(--royal);
      transition: transform 0.25s var(--ease);
    }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 9px 16px; border-radius: 7px; font-size: 0.875rem; font-weight: 600;
      line-height: 1.25; white-space: nowrap;
      transition: background-color 0.16s var(--ease), border-color 0.16s var(--ease), color 0.16s var(--ease), box-shadow 0.16s var(--ease), transform 0.14s var(--ease);
    }
    .btn:active { transform: translateY(1px); }
    .btn-sm { padding: 6px 12px; font-size: 0.8125rem; }
    .btn-lg { padding: 12px 22px; font-size: 0.9375rem; border-radius: 8px; }
    .btn-royal { background: var(--royal); color: var(--white); border: 1px solid var(--royal); box-shadow: var(--shadow-xs); }
    .btn-royal:hover { background: var(--royal-hover); border-color: var(--royal-hover); box-shadow: var(--shadow-sm); }
    .btn-navy { background: var(--navy); color: var(--white); border: 1px solid var(--navy); }
    .btn-navy:hover { background: var(--navy-hover); border-color: var(--navy-hover); }
    .btn-periwinkle { background: var(--periwinkle); color: var(--royal); border: 1px solid var(--periwinkle-border); }
    .btn-periwinkle:hover { background: #DCE4FF; }
    .btn-mint { background: var(--mint); color: var(--mint-text); border: 1px solid #9BE5BA; }
    .btn-mint:hover { background: #A2EAC0; }
    .btn-outline { background: var(--white); color: var(--dark-text); border: 1px solid var(--border-strong); box-shadow: var(--shadow-xs); }
    .btn-outline:hover { background: var(--cloud); border-color: var(--navy); }
    .btn-ghost { background: transparent; color: var(--slate); border: 1px solid transparent; }
    .btn-ghost:hover { background: var(--periwinkle); color: var(--royal); }
    .btn-danger { background: var(--white); color: var(--danger); border: 1px solid var(--danger-border); }
    .btn-danger:hover { background: var(--danger-bg); }

    /* Badges & Cards */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; line-height: 1.35;
    }
    .badge-navy { background: var(--navy); color: var(--white); }
    .badge-royal { background: var(--royal); color: var(--white); }
    .badge-periwinkle { background: var(--periwinkle); color: var(--royal); border: 1px solid var(--periwinkle-border); }
    .badge-mint { background: var(--mint); color: var(--mint-text); }
    .badge-cloud { background: var(--cloud); color: var(--dark-text); border: 1px solid var(--border); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning-border); }
    .badge-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }

    .card {
      background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 20px; box-shadow: var(--shadow-xs);
      transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease), transform 0.18s var(--ease);
    }
    .card-interactive:hover { border-color: var(--periwinkle-border); box-shadow: var(--shadow-sm); transform: translateY(-2px); }
    .card-cloud { background: var(--cloud); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; }
    .section-title { font-size: 1rem; font-weight: 700; color: var(--navy); }
    .muted { color: var(--slate); }

    /* Forms & Progress */
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-label { font-size: 0.8125rem; font-weight: 600; color: var(--dark-text); }
    .input, .select, .textarea {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: 7px;
      background: var(--white); color: var(--dark-text); font-size: 0.875rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input:focus, .select:focus, .textarea:focus {
      outline: none; border-color: var(--royal); box-shadow: 0 0 0 3px var(--periwinkle);
    }
    .textarea { min-height: 92px; resize: vertical; }
    .form-error {
      font-size: 0.8125rem; color: var(--danger); background: var(--danger-bg);
      border: 1px solid var(--danger-border); padding: 9px 12px; border-radius: 7px; margin-bottom: 14px;
    }
    .progress-track { width: 100%; height: 8px; background: var(--periwinkle); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--royal); border-radius: 999px; transition: width 0.35s var(--ease); }
    .progress-fill-mint { background: var(--mint-strong); }

    /* ==========================================================================
       LANDING PAGE
       ========================================================================== */
    .landing-header { position: sticky; top: 0; z-index: 40; background: var(--white); border-bottom: 1px solid var(--border); }
    .landing-container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .landing-nav { height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .landing-nav-right { display: flex; align-items: center; gap: 22px; }
    .landing-links { display: flex; align-items: center; gap: 22px; font-size: 0.875rem; font-weight: 500; color: var(--slate); }
    .landing-links a:hover { color: var(--royal); }
    .landing-mobile-toggle {
      display: none; width: 38px; height: 38px; border: 1px solid var(--border);
      border-radius: 7px; align-items: center; justify-content: center; color: var(--navy); background: var(--white);
    }
    .landing-mobile-drawer { display: none; border-top: 1px solid var(--border); background: var(--white); padding: 14px 24px 18px; }
    .landing-mobile-drawer.open { display: block; }

    .landing-hero { padding: 56px 0 64px; background: var(--white); border-bottom: 1px solid var(--border); }
    .hero-grid { display: grid; grid-template-columns: 0.96fr 1.04fr; gap: 44px; align-items: center; }
    .hero-title { font-size: clamp(2.05rem, 4vw, 3.3rem); line-height: 1.1; font-weight: 800; color: var(--navy); margin: 16px 0 18px; }
    .hero-title .accent { color: var(--royal); }
    .hero-subtitle { font-size: 1.05rem; color: var(--slate); max-width: 510px; margin-bottom: 24px; line-height: 1.62; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    .hero-trust {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      font-size: 0.8125rem; font-weight: 600; color: var(--navy); padding-top: 16px; border-top: 1px solid var(--border);
    }

    /* Realistic Dashboard UI Preview */
    .preview-frame {
      background: var(--cloud); border: 1px solid var(--border-strong); border-radius: var(--radius-lg);
      padding: 12px; box-shadow: var(--shadow-md);
    }
    .preview-shell {
      background: var(--white); border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; display: grid; grid-template-columns: 52px 1fr;
    }
    .preview-mini-rail {
      background: var(--navy); padding: 14px 0; display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .preview-rail-btn {
      width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.65);
    }
    .preview-rail-btn.active { background: var(--royal); color: var(--white); }
    .preview-canvas { background: var(--cloud); padding: 16px; }

    .landing-section { padding: 72px 0; background: var(--white); }
    .landing-section-cloud { padding: 72px 0; background: var(--cloud); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .section-heading { font-size: 1.9rem; font-weight: 800; color: var(--navy); margin-bottom: 10px; }
    .section-sub { color: var(--slate); max-width: 600px; font-size: 0.975rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

    .feature-icon {
      width: 42px; height: 42px; border-radius: 9px; background: var(--periwinkle);
      border: 1px solid var(--periwinkle-border); color: var(--royal);
      display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px;
      transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }
    .card-interactive:hover .feature-icon { background: var(--royal); color: var(--white); border-color: var(--royal); }
    .landing-footer { background: var(--navy); color: var(--white); padding: 52px 0 28px; }

    /* ==========================================================================
       AUTH / ONBOARDING
       ========================================================================== */
    .auth-page { min-height: 100vh; display: grid; grid-template-columns: 430px 1fr; background: var(--cloud); }
    .auth-aside {
      background: var(--navy); color: var(--white); padding: 40px 36px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .auth-main { display: flex; align-items: center; justify-content: center; padding: 36px 24px; }
    .auth-box {
      width: 100%; max-width: 490px; background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow-sm);
    }
    .auth-tabs {
      display: grid; grid-template-columns: 1fr 1fr; background: var(--cloud);
      border: 1px solid var(--border); border-radius: 8px; padding: 4px; margin-bottom: 22px;
    }
    .auth-tab { padding: 8px 12px; font-size: 0.875rem; font-weight: 600; border-radius: 5px; color: var(--slate); }
    .auth-tab.active { background: var(--white); color: var(--royal); box-shadow: var(--shadow-xs); }
    .exam-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .exam-option {
      border: 1px solid var(--border-strong); border-radius: 8px; padding: 12px; text-align: left;
      background: var(--white); cursor: pointer; transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .exam-option.selected { border-color: var(--royal); background: var(--periwinkle); }

    /* ==========================================================================
       APP SHELL (MIDNIGHT NAVY SIDEBAR + CLOUD WHITE WORKSPACE)
       ========================================================================== */
    .app-shell { display: flex; min-height: 100vh; background: var(--cloud); }
    .sidebar {
      width: var(--sidebar-w); background: var(--navy); color: var(--white);
      display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 50;
      transition: transform 0.22s var(--ease);
    }
    .sidebar-header {
      height: var(--topbar-h); padding: 0 18px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .sidebar-nav { flex: 1; padding: 14px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      width: 100%; display: flex; align-items: center; gap: 11px; padding: 10px 12px;
      border-radius: 7px; font-size: 0.875rem; font-weight: 500; color: rgba(255,255,255,0.78);
      text-align: left; transition: background-color 0.15s ease, color 0.15s ease;
    }
    .nav-item:hover { background: var(--navy-hover); color: var(--white); }
    .nav-item.active { background: var(--royal); color: var(--white); font-weight: 600; }
    .sidebar-footer {
      padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 0.75rem; color: rgba(255,255,255,0.78);
    }

    .main-wrapper { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-width: 0; background: var(--cloud); }
    .topbar {
      height: var(--topbar-h); background: var(--white); border-bottom: 1px solid var(--border);
      padding: 0 24px; display: flex; align-items: center; justify-content: space-between;
      gap: 16px; position: sticky; top: 0; z-index: 30;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mobile-menu-btn {
      display: none; padding: 7px; border: 1px solid var(--border);
      border-radius: 7px; color: var(--navy); background: var(--white);
    }
    .topbar-search { position: relative; width: 340px; max-width: 100%; }
    .topbar-search-input {
      width: 100%; padding: 8px 12px 8px 36px; border: 1px solid var(--border);
      border-radius: 7px; background: var(--cloud); font-size: 0.8125rem;
    }
    .topbar-search-input:focus { outline: none; background: var(--white); border-color: var(--royal); box-shadow: 0 0 0 3px var(--periwinkle); }
    .topbar-search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--slate); pointer-events: none; }
    .search-dropdown {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--white);
      border: 1px solid var(--border-strong); border-radius: var(--radius-md);
      box-shadow: var(--shadow-md); max-height: 340px; overflow-y: auto; z-index: 60;
    }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 7px; border: 1px solid var(--border);
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--navy); position: relative; background: var(--white);
    }
    .icon-btn:hover { background: var(--periwinkle); color: var(--royal); }
    .notif-dot {
      position: absolute; top: 6px; right: 6px; width: 7px; height: 7px;
      border-radius: 50%; background: var(--royal); border: 1.5px solid var(--white);
    }
    .notif-popover {
      position: absolute; top: calc(100% + 8px); right: 0; width: 320px; background: var(--white);
      border: 1px solid var(--border-strong); border-radius: var(--radius-md);
      box-shadow: var(--shadow-md); z-index: 60; padding: 12px;
    }
    .profile-pill {
      display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 5px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--white);
    }
    .profile-pill:hover { background: var(--cloud); border-color: var(--periwinkle-border); }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; background: var(--periwinkle); color: var(--royal);
      font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
    }

    .main-content { padding: 24px 28px 48px; max-width: 1320px; width: 100%; margin: 0 auto; }
    .page-header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .page-title { font-size: 1.55rem; font-weight: 800; color: var(--navy); }
    .page-subtitle { font-size: 0.875rem; color: var(--slate); margin-top: 2px; }

    /* ==========================================================================
       DASHBOARD & MODULE SPECIFIC
       ========================================================================== */
    .welcome-banner {
      background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 18px; margin-bottom: 18px; box-shadow: var(--shadow-xs);
    }
    .stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 18px; }
    .stat-card {
      background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
      box-shadow: var(--shadow-xs); transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .stat-card:hover { border-color: var(--periwinkle-border); box-shadow: var(--shadow-sm); }
    .stat-label { font-size: 0.72rem; font-weight: 700; color: var(--slate); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-value { font-size: 1.55rem; font-weight: 800; color: var(--navy); line-height: 1.1; }
    .stat-foot { font-size: 0.75rem; color: var(--slate); }
    .quick-actions-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .dashboard-grid { display: grid; grid-template-columns: 1.35fr 0.65fr; gap: 20px; margin-bottom: 20px; }

    .tabs-bar {
      display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px;
      background: var(--cloud); border: 1px solid var(--border); border-radius: 8px;
    }
    .tab-btn { padding: 6px 14px; border-radius: 5px; font-size: 0.8125rem; font-weight: 600; color: var(--slate); }
    .tab-btn:hover { color: var(--navy); }
    .tab-btn.active { background: var(--white); color: var(--royal); box-shadow: var(--shadow-xs); }

    /* Timer */
    .timer-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    .timer-circle-wrap { position: relative; width: 250px; height: 250px; margin: 20px auto; display: flex; align-items: center; justify-content: center; }
    .timer-readout { position: absolute; text-align: center; }
    .timer-digits { font-size: 2.9rem; font-weight: 800; color: var(--navy); letter-spacing: -0.03em; line-height: 1; }

    /* Tables */
    .table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--white); box-shadow: var(--shadow-xs); }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th {
      text-align: left; padding: 11px 14px; background: var(--cloud); color: var(--slate);
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border);
    }
    td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: #FAFBFD; }
    tr:last-child td { border-bottom: none; }

    /* Planner views */
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
    .week-col { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--white); min-height: 280px; display: flex; flex-direction: column; overflow: hidden; }
    .week-col-head {
      padding: 10px; border-bottom: 1px solid var(--border); background: var(--cloud);
      font-size: 0.8125rem; font-weight: 700; color: var(--navy); display: flex; justify-content: space-between; align-items: center;
    }
    .week-col-head.today { background: var(--royal); color: var(--white); }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--border); border-left: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .cal-head-cell { padding: 8px; text-align: center; font-size: 0.75rem; font-weight: 700; color: var(--slate); background: var(--cloud); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .cal-cell { min-height: 94px; padding: 6px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--white); cursor: pointer; }
    .cal-cell:hover { background: var(--cloud); }
    .cal-cell.selected { outline: 2px solid var(--royal); outline-offset: -2px; background: #F4F6FF; }

    /* Heatmap & Tooltip */
    .heatmap-grid { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
    .heatmap-col { display: flex; flex-direction: column; gap: 4px; }
    .heatmap-cell { width: 14px; height: 14px; border-radius: 3px; background: var(--cloud); border: 1px solid var(--border); cursor: pointer; }
    .chart-tooltip {
      position: fixed; z-index: 150; background: var(--navy); color: var(--white);
      padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;
      pointer-events: none; box-shadow: var(--shadow-sm); white-space: nowrap;
    }

    /* Modals, Toasts, Empty State */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(23, 36, 58, 0.45);
      display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100;
    }
    .modal {
      width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto;
      background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 24px; box-shadow: var(--shadow-md);
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .toast-stack { position: fixed; bottom: 20px; right: 20px; z-index: 120; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
    .toast {
      background: var(--navy); color: var(--white); border-left: 4px solid var(--mint);
      padding: 12px 16px; border-radius: 7px; box-shadow: var(--shadow-md);
      font-size: 0.875rem; font-weight: 500; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      animation: fadeSlideUp 0.2s var(--ease);
    }
    .empty-state { text-align: center; padding: 36px 20px; border: 1px dashed var(--border-strong); border-radius: var(--radius-md); background: var(--cloud); }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(23, 36, 58, 0.45); z-index: 45; }

    /* ==========================================================================
       RESPONSIVE BREAKPOINTS (TABLET & MOBILE)
       ========================================================================== */
    @media (max-width: 1120px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
      .dashboard-grid, .timer-layout { grid-template-columns: 1fr; }
      .week-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr; gap: 28px; }
      .auth-page { grid-template-columns: 1fr; }
      .auth-aside { display: none; }
      .landing-nav-right { display: none; }
      .landing-mobile-toggle { display: inline-flex; }
      .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .main-wrapper { margin-left: 0; }
      .mobile-menu-btn { display: inline-flex; }
      .topbar-search { width: 190px; }
    }
    @media (max-width: 640px) {
      .landing-container { padding: 0 16px; }
      .landing-hero { padding: 28px 0 36px; }
      .hero-title { font-size: 1.9rem; margin: 10px 0 12px; }
      .hero-subtitle { font-size: 0.95rem; margin-bottom: 18px; }
      .hero-actions { flex-direction: column; }
      .hero-actions .btn { width: 100%; }
      .preview-shell { grid-template-columns: 1fr; }
      .preview-mini-rail { display: none; }
      .landing-section, .landing-section-cloud { padding: 44px 0; }
      .stats-grid, .grid-2, .form-row, .week-grid { grid-template-columns: 1fr; }
      .main-content { padding: 16px 14px 40px; }
      .topbar { padding: 0 14px; }
      .topbar-search { display: none; }
    }
  </style>
</head>

    function logoSvg(darkBg = false, compact = false) {
      const textColor = darkBg ? '#FFFFFF' : '#17243A';
      const subColor = darkBg ? 'rgba(255,255,255,0.68)' : '#687386';

            <path d="M9.5 11.5H23V15H18.2V26.5H14.3V15H9.5V11.5Z" fill="#FFFFFF"/>
            <path d="M20.5 23.5L25 19L28 21.5V14.5H21L23.5 17" stroke="${darkBg ? '#B8F2D0' : '#4966E9'}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

          </svg>
          <div style="line-height:1.15;">
            <div class="display-font" style="font-weight:800;font-size:1.06rem;color:${textColor};">TeachSaathi</div>

    }

    /* ==========================================================================
       2. UTILITIES & INTERACTIVE MICRO-EFFECTS
       ========================================================================== */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function toLocalDateStr(date = new Date()) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function addDays(dateStr, delta) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + delta);
      return toLocalDateStr(dt);
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '—';
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function simpleHash(str) {
      let hash = 5381;
      for (let i = 0; i < str.length; i++) hash = ((hash << 5) + hash) + str.charCodeAt(i);
      return 'h_' + (hash >>> 0).toString(16);
    }

    function pulseLoader() {
      const el = document.getElementById('top-loader');
      if (!el) return;
      el.classList.add('active');
      setTimeout(() => el.classList.remove('active'), 220);
    }

    function showToast(message) {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px;"><span style="color:#B8F2D0;">&#10003;</span>${escapeHtml(message)}</span><button style="color:#B8F2D0;font-weight:700;" aria-label="Close">&times;</button>`;
      el.querySelector('button').onclick = () => el.remove();
      root.appendChild(el);
      setTimeout(() => { if (el.parentNode) el.remove(); }, 3500);
    }

    function playTimerChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0.12, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 0.36);
        });
      } catch (e) {}
    }

    /* ==========================================================================
       3. STORAGE, AUTH & SAMPLE DATA ENGINE (PRESERVES ALL EXISTING DATA)
       ========================================================================== */
    function loadUsers() {
      try { return JSON.parse(localStorage.getItem(STORAGE_USERS_KEY)) || []; }
      catch { return []; }
    }
    function saveUsers(users) { localStorage.setItem(STORAGE_USERS_KEY, JSON.stringify(users)); }
    function getSessionUserId() { return localStorage.getItem(STORAGE_SESSION_KEY); }
    function setSessionUserId(userId) {
      if (userId) localStorage.setItem(STORAGE_SESSION_KEY, userId);
      else localStorage.removeItem(STORAGE_SESSION_KEY);
    }

    function createInitialChaptersForExam(exam) {
      const subjects = EXAM_SUBJECTS[exam] || EXAM_SUBJECTS.NEET;
      const chapters = [];
      subjects.forEach(subj => {
        (DEFAULT_SYLLABUS[subj] || []).forEach(title => {
          chapters.push({
            id: uid('ch'), subject: subj, title, status: 'Not Started', progress: 0,
            deadline: '', notes: '', markedForRevision: false,
            revisions: { first: false, second: false, third: false }, lastRevised: ''
          });
        });
      });
      return chapters;
    }

    function loadUserData(userId, exam) {
      try {
        const raw = localStorage.getItem(STORAGE_DATA_PREFIX + userId);
        if (raw) {
          const p = JSON.parse(raw);
          return {
            chapters: p.chapters || [], tasks: p.tasks || [], sessions: p.sessions || [],
            mockTests: p.mockTests || [], notes: p.notes || []
          };
        }
      } catch (e) {}
      const fresh = { chapters: createInitialChaptersForExam(exam), tasks: [], sessions: [], mockTests: [], notes: [] };
      saveUserData(userId, fresh);
      return fresh;
    }

    function saveUserData(userId, data) {
      localStorage.setItem(STORAGE_DATA_PREFIX + userId, JSON.stringify(data));
    }

    function generateSampleData(exam) {
      const chapters = createInitialChaptersForExam(exam);
      const today = toLocalDateStr();
      const subjects = EXAM_SUBJECTS[exam];

      chapters.forEach((ch, idx) => {
        const mod = idx % 5;
        if (mod === 0 || mod === 1) {
          ch.status = 'Completed'; ch.progress = 100;
          ch.revisions = { first: true, second: mod === 0, third: false };
          ch.lastRevised = addDays(today, -((idx % 6) + 1));
          ch.markedForRevision = mod === 1;
        } else if (mod === 2) {
          ch.status = 'In Progress'; ch.progress = 55;
          ch.deadline = addDays(today, 4); ch.markedForRevision = true;
        }
      });

      const tasks = [
        { id: uid('tsk'), title: `Solve 45 MCQs on ${chapters[2]?.title || 'Core Concepts'}`, subject: subjects[0], chapterId: chapters[2]?.id || '', date: today, time: '09:00', priority: 'High', deadline: today, completed: true, notes: 'Review error log after completion.' },
        { id: uid('tsk'), title: 'Revise NCERT formulas & high-yield reactions', subject: subjects[1], chapterId: chapters[13]?.id || '', date: today, time: '16:30', priority: 'High', deadline: today, completed: false, notes: 'Write summary sheet.' },
        { id: uid('tsk'), title: 'Complete lecture notes & PYQ drill', subject: subjects[2], chapterId: chapters[25]?.id || '', date: today, time: '19:30', priority: 'Medium', deadline: addDays(today, 1), completed: false, notes: '' },
        { id: uid('tsk'), title: 'Full-length Sunday mock test review', subject: subjects[0], chapterId: '', date: addDays(today, 2), time: '10:00', priority: 'High', deadline: addDays(today, 2), completed: false, notes: 'Analyze conceptual slips.' }
      ];

      const sessions = [];
      const dayMins = [120, 150, 90, 180, 135, 210, 165, 140, 195, 110, 225, 175, 150, 115];
      dayMins.forEach((totalM, i) => {
        const d = addDays(today, -(13 - i));
        const subj = subjects[i % subjects.length];
        const subjCh = chapters.find(c => c.subject === subj);
        sessions.push({ id: uid('ses'), date: d, timestamp: Date.now() - (13 - i) * 86400000, durationMinutes: Math.round(totalM * 0.6), subject: subj, chapterId: subjCh ? subjCh.id : '', mode: 'Pomodoro' });
        sessions.push({ id: uid('ses'), date: d, timestamp: Date.now() - (13 - i) * 86400000 + 3600000, durationMinutes: Math.round(totalM * 0.4), subject: subjects[(i + 1) % subjects.length], chapterId: '', mode: 'Deep Focus' });
      });

      const totalMax = exam === 'NEET' ? 720 : 300;
      const mockTests = [
        { id: uid('tst'), name: `${exam} Foundation Test #1`, date: addDays(today, -21), type: 'Part Test', totalMarks: totalMax, obtainedMarks: exam === 'NEET' ? 512 : 168, accuracy: 76, mistakes: 18, subjectScores: exam === 'NEET' ? { Physics: 112, Chemistry: 128, Botany: 138, Zoology: 134 } : { Physics: 54, Chemistry: 62, Mathematics: 52 }, notes: 'Speed up Physics numericals.' },
        { id: uid('tst'), name: `${exam} Cumulative Mock #2`, date: addDays(today, -12), type: 'Full Syllabus', totalMarks: totalMax, obtainedMarks: exam === 'NEET' ? 568 : 196, accuracy: 82, mistakes: 13, subjectScores: exam === 'NEET' ? { Physics: 128, Chemistry: 142, Botany: 150, Zoology: 148 } : { Physics: 64, Chemistry: 70, Mathematics: 62 }, notes: 'Organic accuracy improved.' },
        { id: uid('tst'), name: `${exam} Grand Test Series #3`, date: addDays(today, -4), type: 'Full Syllabus', totalMarks: totalMax, obtainedMarks: exam === 'NEET' ? 614 : 224, accuracy: 87, mistakes: 9, subjectScores: exam === 'NEET' ? { Physics: 142, Chemistry: 154, Botany: 160, Zoology: 158 } : { Physics: 74, Chemistry: 78, Mathematics: 72 }, notes: 'Strong time pacing.' }
      ];

      const notes = [
        { id: uid('nt'), title: 'High-Yield Formula & Constant Sheet', subject: subjects[0], chapterId: chapters[0]?.id || '', content: 'Run dimensional checks on every unfamiliar equation before substituting values.', updatedAt: today },
        { id: uid('nt'), title: 'Reaction Mechanisms & Exceptions', subject: subjects[1], chapterId: chapters[14]?.id || '', content: 'Compare SN1 vs SN2 solvent polarity, carbocation stability, and temperature dependence.', updatedAt: addDays(today, -2) }
      ];

      return { chapters, tasks, sessions, mockTests, notes };
    }

    function loginDemoAccount(exam) {
      const email = exam === 'NEET' ? 'demo.neet@teachsaathi.in' : 'demo.jee@teachsaathi.in';
      const users = loadUsers();
      let user = users.find(u => u.email === email);
      if (!user) {
        user = {
          id: uid('usr'),
          name: exam === 'NEET' ? 'Aarav Sharma (Sample)' : 'Ananya Verma (Sample)',
          email, passwordHash: simpleHash('demo1234'), exam, targetYear: '2027',
          prepLevel: 'Class 12', dailyGoalHours: 6, createdAt: toLocalDateStr(),
          preferences: { studyReminders: true, deadlineAlerts: true, revisionPrompts: true, timerSound: true }
        };
        users.push(user);
        saveUsers(users);
        saveUserData(user.id, generateSampleData(exam));
      }
      setSessionUserId(user.id);
      appState.user = user;
      appState.data = loadUserData(user.id, user.exam);
      appState.screen = 'app';

    /* ==========================================================================
       4. APPLICATION STATE & DRIFT-FREE TIMER ENGINE
       ========================================================================== */
    const appState = {
      screen: 'landing',
      authMode: 'login',
      section: 'dashboard',
      user: null,
      data: null,
      landingMenuOpen: false,
      mobileSidebarOpen: false,
      searchQuery: '',
      notifOpen: false,
      readNotifIds: new Set(),
      plannerView: 'daily',
      plannerDate: toLocalDateStr(),
      plannerFilterSubject: 'All',
      syllabusSubject: 'All',
      syllabusStatus: 'All',
      syllabusSearch: '',
      notesTab: 'notes',
      notesSubjectFilter: 'All',
      notesSearch: '',
      analyticsRange: 14,
      timer: {
        mode: 'study', customMinutes: 45, totalSeconds: 25 * 60, remainingSeconds: 25 * 60,
        running: false, endTimestamp: null, intervalId: null, subject: '', chapterId: ''
      }
    };

    function getModeMinutes(mode, customMin) {
      if (mode === 'study') return 25;
      if (mode === 'short') return 5;
      if (mode === 'long') return 15;
      return Math.max(1, Math.min(180, Number(customMin) || 45));
    }

    function setTimerMode(mode) {
      stopTimerInterval();
      const mins = getModeMinutes(mode, appState.timer.customMinutes);
      appState.timer.mode = mode; appState.timer.running = false; appState.timer.endTimestamp = null;
      appState.timer.totalSeconds = mins * 60; appState.timer.remainingSeconds = mins * 60;
      render();
    }

    function startTimer() {
      if (appState.timer.running) return;
      if (appState.timer.remainingSeconds <= 0) {
        const mins = getModeMinutes(appState.timer.mode, appState.timer.customMinutes);
        appState.timer.totalSeconds = mins * 60; appState.timer.remainingSeconds = mins * 60;
      }
      appState.timer.running = true;
      appState.timer.endTimestamp = Date.now() + appState.timer.remainingSeconds * 1000;
      appState.timer.intervalId = setInterval(tickTimer, 250);
      render();
    }

    function pauseTimer() {
      if (!appState.timer.running) return;
      appState.timer.remainingSeconds = Math.max(0, Math.ceil((appState.timer.endTimestamp - Date.now()) / 1000));
      appState.timer.running = false; appState.timer.endTimestamp = null;
      stopTimerInterval(); render();
    }

    function resetTimer() {
      stopTimerInterval();
      const mins = getModeMinutes(appState.timer.mode, appState.timer.customMinutes);
      appState.timer.running = false; appState.timer.endTimestamp = null;
      appState.timer.totalSeconds = mins * 60; appState.timer.remainingSeconds = mins * 60;
      render();
    }

    function stopTimerInterval() {
      if (appState.timer.intervalId) { clearInterval(appState.timer.intervalId); appState.timer.intervalId = null; }
    }

    function tickTimer() {
      if (!appState.timer.running || !appState.timer.endTimestamp) return;
      const diff = Math.max(0, Math.ceil((appState.timer.endTimestamp - Date.now()) / 1000));
      if (diff !== appState.timer.remainingSeconds) {
        appState.timer.remainingSeconds = diff;
        if (appState.section === 'timer') updateTimerDomOnly();
      }
      if (diff <= 0) completeTimerSession(false);
    }

    function updateTimerDomOnly() {
      const digitsEl = document.getElementById('timer-digits');
      const arcEl = document.getElementById('timer-arc');
      if (digitsEl) digitsEl.textContent = formatMMSS(appState.timer.remainingSeconds);
      if (arcEl) {
        const r = 104, c = 2 * Math.PI * r;
        const pct = appState.timer.totalSeconds > 0 ? (appState.timer.totalSeconds - appState.timer.remainingSeconds) / appState.timer.totalSeconds : 0;
        arcEl.setAttribute('stroke-dashoffset', String(c * (1 - pct)));
      }
      document.title = `${formatMMSS(appState.timer.remainingSeconds)} — TeachSaathi`;
    }

    function completeTimerSession(manualEarly = false) {
      stopTimerInterval();
      const elapsedSec = appState.timer.totalSeconds - appState.timer.remainingSeconds;
      const loggedMinutes = manualEarly ? Math.max(1, Math.round(elapsedSec / 60)) : Math.round(appState.timer.totalSeconds / 60);
      appState.timer.running = false; appState.timer.endTimestamp = null;
      document.title = 'TeachSaathi — Your Preparation. Your Progress.';
      if (appState.user?.preferences?.timerSound) playTimerChime();

      if ((appState.timer.mode === 'study' || appState.timer.mode === 'custom') && appState.user && appState.data) {
        const subj = appState.timer.subject || EXAM_SUBJECTS[appState.user.exam][0];
        appState.data.sessions.push({
          id: uid('ses'), date: toLocalDateStr(), timestamp: Date.now(), durationMinutes: loggedMinutes,
          subject: subj, chapterId: appState.timer.chapterId || '',
          mode: appState.timer.mode === 'study' ? 'Pomodoro 25m' : `Custom ${loggedMinutes}m`
        });
        persistCurrentUserData();
        showToast(`Logged ${loggedMinutes}m focus session in ${subj}`);
      } else {
        showToast('Break complete! Ready for your next block.');
      }
      const mins = getModeMinutes(appState.timer.mode, appState.timer.customMinutes);
      appState.timer.totalSeconds = mins * 60; appState.timer.remainingSeconds = mins * 60;
      render();
    }

    function formatMMSS(sec) {
      return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
    }

    function persistCurrentUserData() {
      if (appState.user && appState.data) saveUserData(appState.user.id, appState.data);
    }

    /* ==========================================================================
       5. METRICS & ANALYTICS ENGINE
       ========================================================================== */
    function computeMetrics() {
      const user = appState.user, data = appState.data;
      if (!user || !data) return {};
      const today = toLocalDateStr(), subjects = EXAM_SUBJECTS[user.exam];

      const totalMins = data.sessions.reduce((s, x) => s + (Number(x.durationMinutes) || 0), 0);
      const todayMins = data.sessions.filter(x => x.date === today).reduce((s, x) => s + (Number(x.durationMinutes) || 0), 0);

      const dailyMinsMap = {};
      data.sessions.forEach(s => { dailyMinsMap[s.date] = (dailyMinsMap[s.date] || 0) + (Number(s.durationMinutes) || 0); });

      let streak = 0, cursor = (dailyMinsMap[today] || 0) > 0 ? today : addDays(today, -1);
      while ((dailyMinsMap[cursor] || 0) > 0) { streak++; cursor = addDays(cursor, -1); }

      const activeDates = Object.keys(dailyMinsMap).filter(d => dailyMinsMap[d] > 0).sort();
      let longestStreak = 0, run = 0;
      for (let i = 0; i < activeDates.length; i++) {
        run = (i === 0 || addDays(activeDates[i - 1], 1) === activeDates[i]) ? run + 1 : 1;
        if (run > longestStreak) longestStreak = run;
      }

      const totalChapters = data.chapters.length;
      const completedChapters = data.chapters.filter(c => c.status === 'Completed').length;
      const inProgressChapters = data.chapters.filter(c => c.status === 'In Progress').length;
      const syllabusPct = totalChapters > 0 ? Math.round(data.chapters.reduce((a, b) => a + (Number(b.progress) || 0), 0) / totalChapters) : 0;

      const subjectStats = {};
      subjects.forEach(subj => {
        const chs = data.chapters.filter(c => c.subject === subj);
        const mins = data.sessions.filter(s => s.subject === subj).reduce((a, b) => a + (Number(b.durationMinutes) || 0), 0);
        const comp = chs.filter(c => c.status === 'Completed').length;
        const pct = chs.length > 0 ? Math.round(chs.reduce((a, b) => a + (Number(b.progress) || 0), 0) / chs.length) : 0;
        const testsWithSubj = data.mockTests.filter(t => t.subjectScores && t.subjectScores[subj] !== undefined);
        const avgSubjScore = testsWithSubj.length > 0 ? Math.round(testsWithSubj.reduce((a, b) => a + Number(b.subjectScores[subj] || 0), 0) / testsWithSubj.length) : null;
        subjectStats[subj] = { totalChapters: chs.length, completedChapters: comp, inProgressChapters: chs.filter(c => c.status === 'In Progress').length, progressPct: pct, hours: +(mins / 60).toFixed(1), minutes: mins, avgSubjScore };
      });

      const pendingTasks = data.tasks.filter(t => !t.completed);
      const todayTasks = data.tasks.filter(t => t.date === today);

      const last7Days = [];
      let weeklyMins = 0;
      for (let i = 6; i >= 0; i--) {
        const d = addDays(today, -i), mins = dailyMinsMap[d] || 0;
        weeklyMins += mins;
        last7Days.push({ date: d, label: new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short' }), hours: +(mins / 60).toFixed(2) });
      }

      const sortedTests = [...data.mockTests].sort((a, b) => a.date.localeCompare(b.date));
      const testPcts = sortedTests.map(t => t.totalMarks > 0 ? Math.round((t.obtainedMarks / t.totalMarks) * 100) : 0);
      const avgTestPct = testPcts.length ? Math.round(testPcts.reduce((a, b) => a + b, 0) / testPcts.length) : 0;
      const highestTest = sortedTests.reduce((best, t) => (!best || (t.obtainedMarks / t.totalMarks) > (best.obtainedMarks / best.totalMarks) ? t : best), null);
      const improvement = testPcts.length >= 2 ? (testPcts[testPcts.length - 1] - testPcts[0]) : 0;
      const bestDayMins = Object.values(dailyMinsMap).reduce((m, v) => Math.max(m, v), 0);

      const notifications = [];
      const overdue = pendingTasks.filter(t => t.deadline && t.deadline < today);
      if (overdue.length > 0) notifications.push({ id: 'n_overdue', title: `${overdue.length} overdue task(s)`, desc: 'Review your planner deadlines.', section: 'planner' });
      const dueRev = data.chapters.filter(c => c.markedForRevision);
      if (dueRev.length > 0) notifications.push({ id: 'n_rev', title: `${dueRev.length} chapter(s) flagged for revision`, desc: 'Open Notes & Revision to log a pass.', section: 'notes' });
      if (todayMins === 0) notifications.push({ id: 'n_today', title: 'No study session logged today', desc: 'Start a 25m Pomodoro block to build momentum.', section: 'timer' });
      if (streak >= 3) notifications.push({ id: 'n_streak', title: `${streak}-day active study streak`, desc: 'Keep going to reach your weekly milestone.', section: 'achievements' });

      return {
        today, totalHours: +(totalMins / 60).toFixed(1), todayHours: +(todayMins / 60).toFixed(1), todayMins,
        weeklyHours: +(weeklyMins / 60).toFixed(1), streak, longestStreak,
        totalChapters, completedChapters, inProgressChapters, syllabusPct,
        subjectStats, pendingTasks, todayTasks, last7Days, dailyMinsMap,
        sortedTests, avgTestPct, highestTest, improvement, bestDayHours: +(bestDayMins / 60).toFixed(1), notifications
      };
    }

    /* ==========================================================================
       6. DATA VISUALIZATION SVG BUILDERS WITH INTERACTIVE TOOLTIPS
       ========================================================================== */
    function renderBarChartSvg(items, targetValue = null, height = 190) {
      if (!items.length) return '';
      const maxVal = Math.max(targetValue || 0, ...items.map(i => i.value), 1);
      const w = 520, padL = 34, padB = 26, padT = 16, chartW = w - padL - 12, chartH = height - padT - padB;
      const barStep = chartW / items.length, barW = Math.min(32, barStep * 0.58);

      let targetLine = '';
      if (targetValue && targetValue > 0) {
        const ty = padT + chartH - (targetValue / maxVal) * chartH;
        targetLine = `
          <line x1="${padL}" y1="${ty}" x2="${w - 8}" y2="${ty}" stroke="#4966E9" stroke-dasharray="4 4" stroke-width="1.3" opacity="0.7"/>
          <text x="${w - 10}" y="${ty - 5}" text-anchor="end" font-size="10" fill="#4966E9" font-weight="700">Goal ${targetValue}h</text>
        `;
      }

      const gridLines = [0, 0.5, 1].map(frac => {
        const y = padT + chartH * (1 - frac);
        const val = (maxVal * frac).toFixed(1).replace(/\.0$/, '');
        return `<line x1="${padL}" y1="${y}" x2="${w - 8}" y2="${y}" stroke="#E4E8F2" stroke-width="1"/><text x="${padL - 6}" y="${y + 3}" text-anchor="end" font-size="10" fill="#687386">${val}</text>`;
      }).join('');

      const bars = items.map((item, idx) => {
        const barH = Math.max(3, (item.value / maxVal) * chartH);
        const x = padL + idx * barStep + (barStep - barW) / 2;
        const y = padT + chartH - barH;
        const fill = item.highlight ? '#27AE60' : '#4966E9';
        return `
          <g class="svg-tip-target" data-tip="${escapeHtml(item.label)}: ${item.value} hrs" style="cursor:pointer;">
            <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="4" fill="${fill}"/>
            <text x="${x + barW / 2}" y="${height - 8}" text-anchor="middle" font-size="10" fill="#687386">${escapeHtml(item.label)}</text>
          </g>
        `;
      }).join('');

      return `<svg viewBox="0 0 ${w} ${height}" width="100%" height="${height}" style="display:block;">${gridLines}${targetLine}${bars}</svg>`;
    }

    function renderLineChartSvg(points, height = 190) {
      if (!points.length) return '';
      const w = 520, padL = 36, padR = 16, padT = 20, padB = 28, chartW = w - padL - padR, chartH = height - padT - padB;
      const grid = [0, 25, 50, 75, 100].map(v => {
        const y = padT + chartH - (v / 100) * chartH;
        return `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="#E4E8F2" stroke-width="1"/><text x="${padL - 6}" y="${y + 3}" text-anchor="end" font-size="10" fill="#687386">${v}%</text>`;
      }).join('');

      const coords = points.map((pt, i) => ({
        x: points.length === 1 ? padL + chartW / 2 : padL + (i / (points.length - 1)) * chartW,
        y: padT + chartH - (Math.min(100, Math.max(0, pt.value)) / 100) * chartH, ...pt
      }));
      const poly = coords.map(c => `${c.x},${c.y}`).join(' ');
      const dots = coords.map(c => `
        <g class="svg-tip-target" data-tip="${escapeHtml(c.label)}: ${c.value}%" style="cursor:pointer;">
          <circle cx="${c.x}" cy="${c.y}" r="5.5" fill="#FFFFFF" stroke="#4966E9" stroke-width="2.5"/>
          <text x="${c.x}" y="${c.y - 10}" text-anchor="middle" font-size="10" font-weight="700" fill="#17243A">${c.value}%</text>
          <text x="${c.x}" y="${height - 8}" text-anchor="middle" font-size="10" fill="#687386">${escapeHtml(c.shortLabel)}</text>
        </g>
      `).join('');

      return `<svg viewBox="0 0 ${w} ${height}" width="100%" height="${height}" style="display:block;">${grid}${coords.length > 1 ? `<polyline fill="none" stroke="#4966E9" stroke-width="2.5" points="${poly}"/>` : ''}${dots}</svg>`;
    }

    function renderAppShell() {
      const user = appState.user, metrics = computeMetrics();
      const initials = user.name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
      const unreadCount = metrics.notifications.filter(n => !appState.readNotifIds.has(n.id)).length;
      const goalPct = Math.min(100, Math.round((metrics.todayHours / Math.max(1, user.dailyGoalHours)) * 100));

      let sectionHtml = '';
      switch (appState.section) {
        case 'dashboard': sectionHtml = renderDashboardSection(metrics); break;
        case 'planner': sectionHtml = renderPlannerSection(metrics); break;
        case 'timer': sectionHtml = renderTimerSection(metrics); break;
        case 'subjects': sectionHtml = renderSubjectsSection(metrics); break;
        case 'syllabus': sectionHtml = renderSyllabusSection(metrics); break;
        case 'tests': sectionHtml = renderMockTestsSection(metrics); break;
        case 'notes': sectionHtml = renderNotesSection(metrics); break;
        case 'analytics': sectionHtml = renderAnalyticsSection(metrics); break;
        case 'achievements': sectionHtml = renderAchievementsSection(metrics); break;
        case 'settings': sectionHtml = renderSettingsSection(metrics); break;
        default: sectionHtml = renderDashboardSection(metrics);
      }

      return `
        <div class="app-shell">
          <div class="sidebar-overlay ${appState.mobileSidebarOpen ? 'open' : ''}" id="sidebar-overlay"></div>
          <aside class="sidebar ${appState.mobileSidebarOpen ? 'open' : ''}" aria-label="Main Navigation">
            <div class="sidebar-header">
              ${logoSvg(true, true)}
              <span class="badge badge-mint" style="font-size:0.7rem;">${escapeHtml(user.exam)} ${escapeHtml(user.targetYear)}</span>
            </div>
            <nav class="sidebar-nav">
              ${NAV_ITEMS.map(item => `
                <button class="nav-item ${appState.section === item.id ? 'active' : ''}" data-action="nav" data-section="${item.id}">
                  <span style="display:inline-flex;">${iconSvg(item.icon, 17)}</span>
                  <span>${item.label}</span>
                </button>
              `).join('')}
            </nav>
            <div class="sidebar-footer">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span>Daily Goal</span>
                <strong style="color:var(--mint);" class="tabular">${metrics.todayHours} / ${user.dailyGoalHours}h</strong>
              </div>
              <div class="progress-track" style="height:6px;background:rgba(255,255,255,0.14);margin-bottom:10px;">
                <div class="progress-fill ${goalPct >= 100 ? 'progress-fill-mint' : ''}" style="width:${goalPct}%;background:${goalPct >= 100 ? 'var(--mint)' : 'var(--royal)'};"></div>
              </div>
              <div style="font-size:0.7rem;opacity:0.72;">Local Browser Storage Active</div>
            </div>
          </aside>

          <div class="main-wrapper">
            <header class="topbar">
              <div class="topbar-left">
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Menu">${iconSvg('menu', 18)}</button>
                <div class="topbar-search">
                  <span class="topbar-search-icon">${iconSvg('search', 15)}</span>
                  <input class="topbar-search-input" id="global-search-input" type="search" placeholder="Search chapters, tasks, notes, tests..." value="${escapeHtml(appState.searchQuery)}" />
                  <div id="global-search-results"></div>
                </div>
              </div>
              <div class="topbar-right">
                ${appState.timer.running ? `
                  <button class="btn btn-royal btn-sm tabular" data-action="nav" data-section="timer">
                    ${iconSvg('clock', 14)} ${formatMMSS(appState.timer.remainingSeconds)}
                  </button>
                ` : ''}
                <div style="position:relative;">
                  <button class="icon-btn" id="notif-toggle-btn" aria-label="Notifications">
                    ${iconSvg('bell', 17)}
                    ${unreadCount > 0 ? '<span class="notif-dot"></span>' : ''}
                  </button>
                  ${appState.notifOpen ? renderNotificationsPopover(metrics) : ''}

                <button class="profile-pill" data-action="nav" data-section="settings" title="Profile & Settings">

      const quote = MOTIVATIONAL_QUOTES[new Date().getDate() % MOTIVATIONAL_QUOTES.length];
      const goalPct = Math.min(100, Math.round((m.todayHours / Math.max(0.5, user.dailyGoalHours)) * 100));
      const subjects = EXAM_SUBJECTS[user.exam];
      const todayPending = m.todayTasks.filter(t => !t.completed);
      const todayDone = m.todayTasks.filter(t => t.completed);
      const todayTimetable = [...m.todayTasks].sort((a, b) => (a.time || '').localeCompare(b.time || ''));

      return `
        <div class="welcome-banner">

            </div>
            <div class="progress-track">

        <div class="quick-actions-row">

          <button class="btn btn-navy" data-action="open-task-modal">${iconSvg('plus', 15)} Add Task</button>
          <button class="btn btn-outline" data-action="nav" data-section="syllabus">${iconSvg('checkSquare', 15)} Track Chapter</button>
          <button class="btn btn-outline" data-action="open-test-modal">${iconSvg('barChart', 15)} Add Mock Test</button>
          <button class="btn btn-outline" data-action="open-note-modal">${iconSvg('fileText', 15)} Write Notes</button>
        </div>

        <div class="dashboard-grid">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <div>
                <h2 class="section-title">Weekly Study Chart</h2>
                <div class="muted" style="font-size:0.8rem;">Last 7 days compared against ${user.dailyGoalHours}h daily goal</div>
              </div>
              <span class="badge badge-periwinkle tabular">${m.weeklyHours}h this week</span>
            </div>
            ${renderBarChartSvg(m.last7Days.map(d => ({ label: d.label, value: d.hours, highlight: d.hours >= user.dailyGoalHours })), user.dailyGoalHours, 195)}
          </div>

          <div class="card" style="display:flex;flex-direction:column;justify-content:space-between;">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                <h2 class="section-title">Subject Mastery</h2>
                <button class="btn btn-ghost btn-sm" data-action="nav" data-section="subjects">View All &rarr;</button>
              </div>
              <div style="display:flex;flex-direction:column;gap:14px;">
                ${subjects.map(subj => {
                  const st = m.subjectStats[subj];
                  return `
                    <div>
                      <div style="display:flex;justify-content:space-between;font-size:0.825rem;margin-bottom:5px;">
                        <strong>${escapeHtml(subj)}</strong>
                        <span class="muted tabular">${st.completedChapters}/${st.totalChapters} ch &bull; <strong>${st.progressPct}%</strong></span>
                      </div>
                      <div class="progress-track">
                        <div class="progress-fill" style="width:${st.progressPct}%;background:${SUBJECT_COLORS[subj] || 'var(--royal)'};"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:0.8rem;font-weight:600;">Overall Syllabus</span>
              <span class="badge badge-mint tabular">${m.syllabusPct}% Completed</span>
            </div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <h2 class="section-title">Today's Timetable &amp; Pending (${todayPending.length})</h2>
              <button class="btn btn-ghost btn-sm" data-action="nav" data-section="planner">Planner &rarr;</button>
            </div>
            ${todayTimetable.length === 0 ? `
              <div class="empty-state" style="padding:24px;">
                <div class="muted" style="font-size:0.875rem;margin-bottom:10px;">No study blocks scheduled for today yet.</div>
                <button class="btn btn-outline btn-sm" data-action="open-task-modal">+ Schedule Study Task</button>
              </div>
            ` : `
              <div style="display:flex;flex-direction:column;gap:8px;">
                ${todayTimetable.map(t => `
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:${t.completed ? 'var(--cloud)' : 'var(--white)'};border:1px solid var(--border);border-radius:7px;">
                    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;">
                      <input type="checkbox" ${t.completed ? 'checked' : ''} data-action="toggle-task" data-id="${t.id}" style="accent-color:var(--royal);" />
                      <div>
                        <div style="font-size:0.875rem;font-weight:600;${t.completed ? 'text-decoration:line-through;color:var(--slate);' : ''}">${escapeHtml(t.title)}</div>

              <span class="badge badge-mint">${todayDone.length} done today</span>
            </div>
            ${m.pendingTasks.length === 0 ? `
              <div class="empty-state" style="padding:24px;">
                <div class="muted" style="font-size:0.875rem;">All scheduled tasks are complete! Great discipline.</div>
              </div>
            ` : `
              <div style="display:flex;flex-direction:column;gap:8px;">
                ${m.pendingTasks.slice(0, 5).map(t => `
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--cloud);border:1px solid var(--border);border-radius:7px;">
                    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;">
                      <input type="checkbox" data-action="toggle-task" data-id="${t.id}" style="accent-color:var(--royal);" />
                      <div>
                        <div style="font-size:0.875rem;font-weight:600;">${escapeHtml(t.title)}</div>

    /* 2. STUDY PLANNER */
    function renderPlannerSection(m) {
      const subjects = EXAM_SUBJECTS[appState.user.exam];
      const allTasks = appState.data.tasks.filter(t => appState.plannerFilterSubject === 'All' || t.subject === appState.plannerFilterSubject);

      let viewHtml = '';
      if (appState.plannerView === 'daily') {
        const dayTasks = allTasks.filter(t => t.date === appState.plannerDate).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
        viewHtml = `
          <div class="card">
            <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <button class="btn btn-outline btn-sm" data-action="planner-shift-day" data-delta="-1">${iconSvg('chevronLeft', 15)}</button>
                <input type="date" class="input" id="planner-date-picker" value="${appState.plannerDate}" style="width:auto;" />
                <button class="btn btn-outline btn-sm" data-action="planner-shift-day" data-delta="1">${iconSvg('chevronRight', 15)}</button>
                <button class="btn btn-ghost btn-sm" data-action="planner-today">Today</button>
              </div>
              <span class="muted" style="font-size:0.85rem;">${dayTasks.length} task(s) on ${formatDisplayDate(appState.plannerDate)}</span>
            </div>
            ${dayTasks.length === 0 ? `
              <div class="empty-state">
                <p class="muted" style="margin-bottom:12px;">No study tasks scheduled for ${formatDisplayDate(appState.plannerDate)}.</p>
                <button class="btn btn-royal btn-sm" data-action="open-task-modal" data-date="${appState.plannerDate}">+ Add Task for This Day</button>
              </div>
            ` : renderTasksTable(dayTasks)}
          </div>
        `;
      } else if (appState.plannerView === 'weekly') {
        const baseDt = new Date(appState.plannerDate + 'T00:00:00');
        const mondayStr = addDays(appState.plannerDate, -((baseDt.getDay() + 6) % 7));
        const days = Array.from({ length: 7 }, (_, i) => addDays(mondayStr, i));
        viewHtml = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div style="display:flex;gap:8px;align-items:center;">
              <button class="btn btn-outline btn-sm" data-action="planner-shift-day" data-delta="-7">&larr; Prev Week</button>
              <strong style="color:var(--navy);font-size:0.9rem;">Week of ${formatDisplayDate(mondayStr)}</strong>
              <button class="btn btn-outline btn-sm" data-action="planner-shift-day" data-delta="7">Next Week &rarr;</button>
            </div>
          </div>
          <div class="week-grid">
            ${days.map(dStr => {
              const dt = new Date(dStr + 'T00:00:00'), dTasks = allTasks.filter(t => t.date === dStr);
              return `
                <div class="week-col">
                  <div class="week-col-head ${dStr === m.today ? 'today' : ''}">
                    <span>${dt.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric' })}</span>
                    <button class="btn btn-sm" style="padding:2px 6px;color:inherit;" data-action="open-task-modal" data-date="${dStr}" title="Add task">+</button>
                  </div>
                  <div style="padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;">
                    ${dTasks.length === 0 ? `<div class="muted" style="font-size:0.75rem;padding:8px;text-align:center;">Free</div>` :
                      dTasks.map(t => `
                        <div style="padding:7px 8px;border:1px solid var(--border);border-radius:6px;background:${t.completed ? 'var(--cloud)' : 'var(--white)'};font-size:0.78rem;">
                          <div style="display:flex;align-items:flex-start;gap:6px;">
                            <input type="checkbox" ${t.completed ? 'checked' : ''} data-action="toggle-task" data-id="${t.id}" style="margin-top:2px;accent-color:var(--royal);" />
                            <div style="flex:1;min-width:0;">
                              <div style="font-weight:600;${t.completed ? 'text-decoration:line-through;color:var(--slate);' : ''}">${escapeHtml(t.title)}</div>
                              <div class="muted" style="font-size:0.7rem;">${escapeHtml(t.subject)} ${t.time ? '&bull; ' + escapeHtml(t.time) : ''}</div>
                            </div>
                          </div>
                        </div>
                      `).join('')
                    }
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (appState.plannerView === 'calendar') {
        const [yr, mo] = appState.plannerDate.split('-').map(Number);
        const firstDay = new Date(yr, mo - 1, 1), startOffset = (firstDay.getDay() + 6) % 7, daysInMonth = new Date(yr, mo, 0).getDate();
        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) cells.push(`${yr}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
        const selectedDayTasks = allTasks.filter(t => t.date === appState.plannerDate);

        viewHtml = `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <strong style="color:var(--navy);font-size:1rem;">${firstDay.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</strong>
              <div style="display:flex;gap:8px;">
                <button class="btn btn-outline btn-sm" data-action="planner-shift-day" data-delta="-30">&larr; Prev</button>
                <button class="btn btn-outline btn-sm" data-action="planner-shift-day" data-delta="30">Next &rarr;</button>
              </div>
            </div>
            <div class="calendar-grid">
              ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(w => `<div class="cal-head-cell">${w}</div>`).join('')}
              ${cells.map(cDate => {
                if (!cDate) return `<div class="cal-cell" style="background:var(--cloud);cursor:default;"></div>`;
                const dayNum = Number(cDate.split('-')[2]), cTasks = allTasks.filter(t => t.date === cDate);
                return `
                  <div class="cal-cell ${cDate === appState.plannerDate ? 'selected' : ''}" data-action="select-planner-date" data-date="${cDate}">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                      <span style="font-size:0.78rem;font-weight:${cDate === m.today ? '800' : '600'};color:${cDate === m.today ? 'var(--royal)' : 'var(--dark-text)'};">${dayNum}</span>
                      ${cTasks.length > 0 ? `<span class="badge badge-periwinkle" style="padding:1px 6px;font-size:0.65rem;">${cTasks.length}</span>` : ''}
                    </div>
                    ${cTasks.slice(0, 2).map(t => `
                      <div style="font-size:0.7rem;padding:2px 5px;margin-bottom:2px;border-radius:4px;background:${t.completed ? 'var(--mint)' : 'var(--royal)'};color:${t.completed ? 'var(--mint-text)' : 'var(--white)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                        ${escapeHtml(t.title)}
                      </div>
                    `).join('')}
                  </div>
                `;
              }).join('')}
            </div>
            <div style="margin-top:16px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <strong style="color:var(--navy);">Tasks on ${formatDisplayDate(appState.plannerDate)}</strong>
                <button class="btn btn-royal btn-sm" data-action="open-task-modal" data-date="${appState.plannerDate}">+ Add on This Date</button>
              </div>
              ${selectedDayTasks.length ? renderTasksTable(selectedDayTasks) : '<div class="muted" style="font-size:0.85rem;">No tasks on selected date.</div>'}
            </div>
          </div>
        `;
      } else {
        const dayTasks = allTasks.filter(t => t.date === appState.plannerDate);
        const hours = Array.from({ length: 18 }, (_, i) => i + 6);
        viewHtml = `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <strong style="color:var(--navy);">Hourly Study Timeline — ${formatDisplayDate(appState.plannerDate)}</strong>
              <input type="date" class="input" id="planner-date-picker" value="${appState.plannerDate}" style="width:auto;" />
            </div>
            <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;">
              ${hours.map(h => {
                const hh = String(h).padStart(2, '0'), slotTasks = dayTasks.filter(t => (t.time || '09:00').startsWith(hh));
                return `
                  <div style="display:grid;grid-template-columns:80px 1fr;border-bottom:1px solid var(--border);min-height:46px;">
                    <div class="tabular" style="padding:10px;background:var(--cloud);border-right:1px solid var(--border);font-size:0.78rem;font-weight:600;color:var(--slate);">${hh}:00</div>
                    <div style="padding:6px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
                      ${slotTasks.map(t => `
                        <div style="display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;background:${t.completed ? 'var(--mint)' : 'var(--royal)'};color:${t.completed ? 'var(--mint-text)' : 'var(--white)'};font-size:0.8rem;font-weight:600;">
                          <input type="checkbox" ${t.completed ? 'checked' : ''} data-action="toggle-task" data-id="${t.id}" />
                          <span>${escapeHtml(t.title)} (${escapeHtml(t.subject)})</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      return `
        <div class="page-header">
          <div>
            <h1 class="page-title">Study Planner</h1>
            <p class="page-subtitle">Organize daily targets, coaching revisions, and weekly practice blocks.</p>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
            <select class="select" id="planner-subject-filter" style="width:auto;">
              <option value="All">All Subjects</option>
              ${subjects.map(s => `<option value="${s}" ${appState.plannerFilterSubject === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
            <div class="tabs-bar">
              ${['daily', 'weekly', 'calendar', 'timeline'].map(v => `
                <button class="tab-btn ${appState.plannerView === v ? 'active' : ''}" data-action="set-planner-view" data-view="${v}">
                  ${v.charAt(0).toUpperCase() + v.slice(1)}
                </button>
              `).join('')}
            </div>
            <button class="btn btn-royal" data-action="open-task-modal">${iconSvg('plus', 15)} New Task</button>
          </div>
        </div>
        ${viewHtml}
      `;
    }

    function renderTasksTable(tasks) {
      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th style="width:40px;">Done</th><th>Task</th><th>Subject</th><th>Time</th><th>Priority</th><th>Deadline</th><th style="text-align:right;">Actions</th></tr>
            </thead>
            <tbody>
              ${tasks.map(t => `
                <tr>
                  <td><input type="checkbox" ${t.completed ? 'checked' : ''} data-action="toggle-task" data-id="${t.id}" style="accent-color:var(--royal);" /></td>
                  <td>
                    <div style="font-weight:600;${t.completed ? 'text-decoration:line-through;color:var(--slate);' : ''}">${escapeHtml(t.title)}</div>
                    ${t.notes ? `<div class="muted" style="font-size:0.75rem;">${escapeHtml(t.notes)}</div>` : ''}
                  </td>
                  <td><span class="badge badge-periwinkle">${escapeHtml(t.subject)}</span></td>
                  <td class="tabular">${escapeHtml(t.time || '—')}</td>
                  <td><span class="badge ${t.priority === 'High' ? 'badge-danger' : t.priority === 'Medium' ? 'badge-warning' : 'badge-cloud'}">${escapeHtml(t.priority)}</span></td>
                  <td class="tabular">${formatDisplayDate(t.deadline)}</td>
                  <td style="text-align:right;">
                    <button class="btn btn-ghost btn-sm" data-action="edit-task" data-id="${t.id}" aria-label="Edit">${iconSvg('edit', 14)}</button>
                    <button class="btn btn-ghost btn-sm" data-action="delete-task" data-id="${t.id}" aria-label="Delete" style="color:var(--danger);">${iconSvg('trash', 14)}</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    /* 3. FOCUS TIMER */
    function renderTimerSection(m) {
      const subjects = EXAM_SUBJECTS[appState.user.exam];
      if (!appState.timer.subject) appState.timer.subject = subjects[0];
      const subjChapters = appState.data.chapters.filter(c => c.subject === appState.timer.subject);
      const radius = 104, circumference = 2 * Math.PI * radius;
      const pct = appState.timer.totalSeconds > 0 ? (appState.timer.totalSeconds - appState.timer.remainingSeconds) / appState.timer.totalSeconds : 0;
      const dashOffset = circumference * (1 - pct);
      const recentSessions = [...appState.data.sessions].sort((a, b) => b.timestamp - a.timestamp).slice(0, 8);
      const elapsedMinutes = Math.floor((appState.timer.totalSeconds - appState.timer.remainingSeconds) / 60);

      return `
        <div class="page-header">
          <div>
            <h1 class="page-title">Focus Timer</h1>
            <p class="page-subtitle">Stay in deep work. Completed focus blocks automatically log to your analytics and streak.</p>
          </div>
          <div style="display:flex;gap:10px;">
            <span class="badge badge-periwinkle tabular">Today: ${m.todayHours}h</span>
            <span class="badge badge-mint tabular">This Week: ${m.weeklyHours}h</span>
          </div>
        </div>

        <div class="timer-layout">
          <div class="card" style="text-align:center;">
            <div class="tabs-bar" style="margin-bottom:16px;">
              <button class="tab-btn ${appState.timer.mode === 'study' ? 'active' : ''}" data-action="timer-mode" data-mode="study">Pomodoro 25m</button>
              <button class="tab-btn ${appState.timer.mode === 'short' ? 'active' : ''}" data-action="timer-mode" data-mode="short">Short Break 5m</button>
              <button class="tab-btn ${appState.timer.mode === 'long' ? 'active' : ''}" data-action="timer-mode" data-mode="long">Long Break 15m</button>
              <button class="tab-btn ${appState.timer.mode === 'custom' ? 'active' : ''}" data-action="timer-mode" data-mode="custom">Custom</button>
            </div>

            ${appState.timer.mode === 'custom' ? `
              <div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:8px;">
                <label class="form-label" for="custom-timer-mins" style="margin:0;">Minutes:</label>
                <input class="input" id="custom-timer-mins" type="number" min="1" max="180" value="${appState.timer.customMinutes}" style="width:90px;" ${appState.timer.running ? 'disabled' : ''} />
                <button class="btn btn-outline btn-sm" data-action="apply-custom-timer" ${appState.timer.running ? 'disabled' : ''}>Set</button>
              </div>
            ` : ''}

            <div class="timer-circle-wrap">
              <svg width="240" height="240" viewBox="0 0 240 240">
                <circle cx="120" cy="120" r="${radius}" fill="none" stroke="#E9EEFF" stroke-width="12"/>
                <circle id="timer-arc" cx="120" cy="120" r="${radius}" fill="none"
                  stroke="${appState.timer.mode === 'short' || appState.timer.mode === 'long' ? '#27AE60' : '#4966E9'}"
                  stroke-width="12" stroke-linecap="round"
                  stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}"
                  transform="rotate(-90 120 120)"/>
              </svg>
              <div class="timer-readout">
                <div id="timer-digits" class="timer-digits tabular">${formatMMSS(appState.timer.remainingSeconds)}</div>
                <div class="muted" style="font-size:0.78rem;font-weight:700;margin-top:6px;">
                  ${appState.timer.mode === 'short' ? 'SHORT BREAK' : appState.timer.mode === 'long' ? 'LONG BREAK' : escapeHtml(appState.timer.subject).toUpperCase()}
                </div>
              </div>
            </div>

            <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;">
              ${!appState.timer.running ? `
                <button class="btn btn-royal btn-lg" data-action="timer-start">${iconSvg('play', 16)} ${appState.timer.remainingSeconds < appState.timer.totalSeconds ? 'Resume' : 'Start Focus'}</button>
              ` : `
                <button class="btn btn-navy btn-lg" data-action="timer-pause">${iconSvg('pause', 16)} Pause</button>
              `}
              <button class="btn btn-outline" data-action="timer-reset">${iconSvg('rotateCcw', 16)} Reset</button>
              ${(appState.timer.mode === 'study' || appState.timer.mode === 'custom') && elapsedMinutes >= 1 ? `

    /* 8. ANALYTICS */
    function renderAnalyticsSection(m) {
      const user = appState.user, subjects = EXAM_SUBJECTS[user.exam], rangeDays = appState.analyticsRange;
      const rangeBars = [];
      let rangeTotalMins = 0;
      for (let i = rangeDays - 1; i >= 0; i--) {
        const d = addDays(m.today, -i), mins = m.dailyMinsMap[d] || 0;
        rangeTotalMins += mins;
        const dt = new Date(d + 'T00:00:00');
        rangeBars.push({
          label: rangeDays <= 14 ? dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }).replace(' ', '') : (i % 4 === 0 ? String(dt.getDate()) : ''),
          value: +(mins / 60).toFixed(2), highlight: (mins / 60) >= user.dailyGoalHours
        });
      }
      const avgDailyHrs = +(rangeTotalMins / 60 / rangeDays).toFixed(1);
      const totalSubjMins = Math.max(1, subjects.reduce((s, subj) => s + m.subjectStats[subj].minutes, 0));

      const weeks = [];
      for (let w = 11; w >= 0; w--) {
        const col = [];
        for (let d = 6; d >= 0; d--) {
          const dtStr = addDays(m.today, -(w * 7 + d));
          col.push({ date: dtStr, mins: m.dailyMinsMap[dtStr] || 0 });
        }
        weeks.push(col);
      }

      return `
        <div class="page-header">
          <div>
            <h1 class="page-title">Performance Analytics</h1>
            <p class="page-subtitle">Interactive productivity metrics derived from your logged focus blocks, syllabus, and mock tests.</p>
          </div>
          <div class="tabs-bar">
            ${[7, 14, 30].map(r => `<button class="tab-btn ${appState.analyticsRange === r ? 'active' : ''}" data-action="set-analytics-range" data-range="${r}">${r} Days</button>`).join('')}
          </div>
        </div>

        <div class="grid-4" style="margin-bottom:20px;">
          <div class="stat-card"><span class="stat-label">${rangeDays}-Day Total</span><span class="stat-value tabular">${+(rangeTotalMins / 60).toFixed(1)}h</span><span class="stat-foot">Target: ${(user.dailyGoalHours * rangeDays).toFixed(0)}h</span></div>
          <div class="stat-card"><span class="stat-label">Daily Average</span><span class="stat-value tabular">${avgDailyHrs}h</span><span class="stat-foot">Goal: ${user.dailyGoalHours}h/day</span></div>
          <div class="stat-card"><span class="stat-label">Goal Adherence</span><span class="stat-value tabular">${Math.min(100, Math.round((avgDailyHrs / Math.max(0.5, user.dailyGoalHours)) * 100))}%</span><span class="stat-foot">Monthly productivity</span></div>
          <div class="stat-card"><span class="stat-label">Best Study Day</span><span class="stat-value tabular">${m.bestDayHours}h</span><span class="stat-foot">Longest streak: ${m.longestStreak}d</span></div>
        </div>

        <div class="grid-2" style="margin-bottom:20px;">
          <div class="card">
            <h2 class="section-title" style="margin-bottom:12px;">Target vs. Actual Study Hours (${rangeDays}D)</h2>
            ${renderBarChartSvg(rangeBars, user.dailyGoalHours, 200)}
          </div>
          <div class="card">
            <h2 class="section-title" style="margin-bottom:12px;">Subject-Wise Time Distribution</h2>
            <div style="display:flex;flex-direction:column;gap:14px;margin-top:12px;">
              ${subjects.map(subj => {
                const st = m.subjectStats[subj], share = Math.round((st.minutes / totalSubjMins) * 100);
                return `
                  <div>
                    <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:5px;">
                      <strong>${subj}</strong><span class="tabular">${st.hours}h (${share}%)</span>

                    <div class="progress-track"><div class="progress-fill" style="width:${share}%;background:${SUBJECT_COLORS[subj] || 'var(--royal)'};"></div></div>

        <div class="grid-2">
          <div class="card">
            <h2 class="section-title" style="margin-bottom:8px;">12-Week Study Streak History</h2>

              ${weeks.map(col => `
                <div class="heatmap-col">
                  ${col.map(cell => {
                    const hrs = cell.mins / 60;
                    let bg = '#F7F8FC';
                    if (hrs >= user.dailyGoalHours) bg = '#27AE60';
                    else if (hrs >= user.dailyGoalHours * 0.5) bg = '#4966E9';
                    else if (cell.mins > 0) bg = '#B9C7FF';
                    return `<div class="heatmap-cell svg-tip-target" style="background:${bg};" data-tip="${cell.date}: ${cell.mins} min"></div>`;

          </div>
          <div class="card">
            <h2 class="section-title" style="margin-bottom:12px;">Mock Test Performance Trend</h2>
            ${m.sortedTests.length === 0 ? `<div class="empty-state" style="padding:24px;"><p class="muted" style="font-size:0.85rem;">Add mock tests to view your score improvement curve here.</p></div>` :
              renderLineChartSvg(m.sortedTests.map((t, i) => ({ label: t.name, shortLabel: `Test ${i + 1}`, value: Math.round((t.obtainedMarks / t.totalMarks) * 100) })), 175)}

    /* 9. ACHIEVEMENTS */

        { title: 'First Focus Block', desc: 'Complete your first timed study session.', cur: appState.data.sessions.length, req: 1, unit: 'sessions' },
        { title: '3-Day Consistency', desc: 'Study on 3 consecutive days.', cur: m.longestStreak, req: 3, unit: 'days' },
        { title: 'Week Warrior', desc: 'Maintain a 7-day active study streak.', cur: m.longestStreak, req: 7, unit: 'days' },
        { title: 'Deep Work 10 Hours', desc: 'Log 10 cumulative study hours.', cur: Math.floor(m.totalHours), req: 10, unit: 'hrs' },
        { title: 'Half-Century Focus', desc: 'Accumulate 50 hours of focused preparation.', cur: Math.floor(m.totalHours), req: 50, unit: 'hrs' },
        { title: 'Syllabus Quartermaster', desc: 'Reach 25% overall syllabus completion.', cur: m.syllabusPct, req: 25, unit: '%' },

      return `
        <div class="page-header">

            <h1 class="page-title">Achievements &amp; Consistency</h1>
            <p class="page-subtitle">Track personal records, weekly targets, and verified study milestones.</p>

          <span class="badge badge-mint">${unlockedCount} / ${badges.length} Milestones Unlocked</span>
        </div>

        <div class="grid-4" style="margin-bottom:20px;">
          <div class="stat-card"><span class="stat-label">Current Streak</span><span class="stat-value tabular">${m.streak} Days</span><span class="stat-foot">Active consecutive days</span></div>
          <div class="stat-card"><span class="stat-label">Longest Streak</span><span class="stat-value tabular">${m.longestStreak} Days</span><span class="stat-foot">Personal consistency record</span></div>
          <div class="stat-card"><span class="stat-label">Best Single Day</span><span class="stat-value tabular">${m.bestDayHours}h</span><span class="stat-foot">Peak daily focus output</span></div>
          <div class="stat-card"><span class="stat-label">Weekly Goal</span><span class="stat-value tabular">${weeklyPct}%</span><span class="stat-foot">${m.weeklyHours} / ${weeklyTarget}h this week</span></div>
        </div>

        <div class="card" style="margin-bottom:20px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <strong style="color:var(--navy);">Weekly Consistency Target Progress</strong>
            <span class="tabular" style="font-weight:700;color:var(--royal);">${m.weeklyHours}h / ${weeklyTarget}h</span>
          </div>
          <div class="progress-track"><div class="progress-fill ${weeklyPct >= 100 ? 'progress-fill-mint' : ''}" style="width:${weeklyPct}%;"></div></div>
        </div>

        <div class="grid-3">
          ${badges.map(b => {
            const unlocked = b.cur >= b.req, pct = Math.min(100, Math.round((b.cur / b.req) * 100));
            return `
              <div class="card card-interactive" style="border-color:${unlocked ? 'var(--periwinkle-border)' : 'var(--border)'};background:${unlocked ? 'var(--white)' : 'var(--cloud)'};">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                  <span style="width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:${unlocked ? 'var(--mint)' : 'var(--white)'};color:${unlocked ? 'var(--mint-text)' : 'var(--slate)'};border:1px solid var(--border);">
                    ${iconSvg('award', 18)}
                  </span>
                  <span class="badge ${unlocked ? 'badge-mint' : 'badge-cloud'}">${unlocked ? 'Unlocked' : 'In Progress'}</span>
                </div>
                <h3 style="font-size:0.95rem;font-weight:700;color:var(--navy);margin-bottom:4px;">${b.title}</h3>
                <p class="muted" style="font-size:0.8rem;margin-bottom:12px;">${b.desc}</p>
                <div style="display:flex;justify-content:space-between;font-size:0.75rem;margin-bottom:4px;">

    /* ==========================================================================
       11. CRUD MODALS
       ========================================================================== */
    function openTaskModal(editTask = null, defaultDate = null) {
      const subjects = EXAM_SUBJECTS[appState.user.exam];
      const t = editTask || { title: '', subject: subjects[0], chapterId: '', date: defaultDate || appState.plannerDate || toLocalDateStr(), time: '17:00', priority: 'Medium', deadline: defaultDate || toLocalDateStr(), notes: '' };
      openModal(editTask ? 'Edit Study Task' : 'Create Study Task', `
        <form id="task-modal-form">
          <div class="form-group"><label class="form-label" for="t-title">Task Title</label><input class="input" id="t-title" required value="${escapeHtml(t.title)}" placeholder="e.g., Solve 40 Electrostatics MCQs" /></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="t-subject">Subject</label><select class="select" id="t-subject">${subjects.map(s => `<option value="${s}" ${t.subject === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
            <div class="form-group"><label class="form-label" for="t-priority">Priority</label><select class="select" id="t-priority">${['High', 'Medium', 'Low'].map(p => `<option value="${p}" ${t.priority === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="t-date">Scheduled Date</label><input class="input" id="t-date" type="date" value="${t.date}" required /></div>
            <div class="form-group"><label class="form-label" for="t-time">Time</label><input class="input" id="t-time" type="time" value="${t.time || '17:00'}" /></div>
          </div>
          <div class="form-group"><label class="form-label" for="t-deadline">Deadline</label><input class="input" id="t-deadline" type="date" value="${t.deadline || t.date}" /></div>
          <div class="form-group"><label class="form-label" for="t-notes">Notes (Optional)</label><textarea class="textarea" id="t-notes" placeholder="Target source, page numbers, or focus points...">${escapeHtml(t.notes || '')}</textarea></div>
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-royal">${editTask ? 'Save Task' : 'Add Task'}</button>
          </div>
        </form>
      `, () => {
        document.getElementById('task-modal-form').onsubmit = (e) => {
          e.preventDefault();
          const payload = {
            id: editTask ? editTask.id : uid('tsk'), title: document.getElementById('t-title').value.trim(),
            subject: document.getElementById('t-subject').value, chapterId: '',
            date: document.getElementById('t-date').value, time: document.getElementById('t-time').value,
            priority: document.getElementById('t-priority').value, deadline: document.getElementById('t-deadline').value,
            notes: document.getElementById('t-notes').value.trim(), completed: editTask ? editTask.completed : false
          };
          if (!payload.title) return;
          if (editTask) { const idx = appState.data.tasks.findIndex(x => x.id === editTask.id); if (idx >= 0) appState.data.tasks[idx] = payload; showToast('Task updated'); }
          else { appState.data.tasks.push(payload); showToast('Study task added'); }
          persistCurrentUserData(); closeModal(); render();
        };
      });
    }

    function openChapterModal(editChapter = null) {
      const subjects = EXAM_SUBJECTS[appState.user.exam];
      const ch = editChapter || { subject: appState.syllabusSubject !== 'All' ? appState.syllabusSubject : subjects[0], title: '', status: 'Not Started', progress: 0, deadline: '', notes: '' };
      openModal(editChapter ? 'Edit Chapter' : 'Add Syllabus Chapter', `
        <form id="chapter-modal-form">
          <div class="form-group"><label class="form-label" for="ch-title">Chapter Name</label><input class="input" id="ch-title" required value="${escapeHtml(ch.title)}" placeholder="e.g., Wave Optics" /></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="ch-subject">Subject</label><select class="select" id="ch-subject">${subjects.map(s => `<option value="${s}" ${ch.subject === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
            <div class="form-group"><label class="form-label" for="ch-status">Status</label><select class="select" id="ch-status">${['Not Started', 'In Progress', 'Completed'].map(st => `<option value="${st}" ${ch.status === st ? 'selected' : ''}>${st}</option>`).join('')}</select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="ch-progress">Progress (%)</label><input class="input" id="ch-progress" type="number" min="0" max="100" value="${ch.progress}" /></div>
            <div class="form-group"><label class="form-label" for="ch-deadline">Target Deadline</label><input class="input" id="ch-deadline" type="date" value="${ch.deadline || ''}" /></div>
          </div>
          <div class="form-group"><label class="form-label" for="ch-notes">Chapter Notes</label><textarea class="textarea" id="ch-notes" placeholder="Weak topics, pending PYQs, NCERT line reminders...">${escapeHtml(ch.notes || '')}</textarea></div>
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-royal">${editChapter ? 'Save Chapter' : 'Add Chapter'}</button>
          </div>
        </form>
      `, () => {
        document.getElementById('chapter-modal-form').onsubmit = (e) => {
          e.preventDefault();
          const st = document.getElementById('ch-status').value;
          let prog = Math.max(0, Math.min(100, Number(document.getElementById('ch-progress').value) || 0));
          if (st === 'Completed') prog = 100;
          if (st === 'Not Started' && !editChapter) prog = 0;
          const payload = {
            id: editChapter ? editChapter.id : uid('ch'), subject: document.getElementById('ch-subject').value,
            title: document.getElementById('ch-title').value.trim(), status: st, progress: prog,
            deadline: document.getElementById('ch-deadline').value, notes: document.getElementById('ch-notes').value.trim(),
            markedForRevision: editChapter ? editChapter.markedForRevision : false,
            revisions: editChapter ? editChapter.revisions : { first: false, second: false, third: false },
            lastRevised: editChapter ? editChapter.lastRevised : ''
          };
          if (!payload.title) return;
          if (editChapter) { const idx = appState.data.chapters.findIndex(x => x.id === editChapter.id); if (idx >= 0) appState.data.chapters[idx] = payload; showToast('Chapter updated'); }
          else { appState.data.chapters.push(payload); showToast('Chapter added to syllabus'); }
          persistCurrentUserData(); closeModal(); render();
        };
      });
    }

            id: uid('tst'), name: document.getElementById('mt-name').value.trim(), date: document.getElementById('mt-date').value,
            type: document.getElementById('mt-type').value, obtainedMarks: Number(document.getElementById('mt-obtained').value),
            totalMarks: Math.max(1, Number(document.getElementById('mt-total').value)),
            accuracy: Number(document.getElementById('mt-acc').value) || 0, mistakes: Number(document.getElementById('mt-mistakes').value) || 0,
            subjectScores, notes: document.getElementById('mt-notes').value.trim()
          });
          persistCurrentUserData(); closeModal(); showToast('Mock test logged'); render();
        };
      });
    }

    function openNoteModal(editNote = null) {
      const subjects = EXAM_SUBJECTS[appState.user.exam];
      const n = editNote || { title: '', subject: appState.notesSubjectFilter !== 'All' ? appState.notesSubjectFilter : subjects[0], chapterId: '', content: '' };
      const chs = appState.data.chapters.filter(c => c.subject === n.subject);
      openModal(editNote ? 'Edit Study Note' : 'New Study Note', `
        <form id="note-modal-form">
          <div class="form-group"><label class="form-label" for="nt-title">Note Title</label><input class="input" id="nt-title" required value="${escapeHtml(n.title)}" placeholder="e.g., Rotational Inertia Formulas" /></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="nt-subject">Subject</label><select class="select" id="nt-subject">${subjects.map(s => `<option value="${s}" ${n.subject === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
            <div class="form-group"><label class="form-label" for="nt-chapter">Chapter (Optional)</label><select class="select" id="nt-chapter"><option value="">General</option>${chs.map(c => `<option value="${c.id}" ${n.chapterId === c.id ? 'selected' : ''}>${escapeHtml(c.title)}</option>`).join('')}</select></div>
          </div>
          <div class="form-group"><label class="form-label" for="nt-content">Note Content</label><textarea class="textarea" id="nt-content" style="min-height:140px;" required placeholder="Write key takeaways, equations, or revision checkpoints...">${escapeHtml(n.content)}</textarea></div>
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-royal">${editNote ? 'Save Note' : 'Create Note'}</button>
          </div>
        </form>
      `, () => {
        const subjSel = document.getElementById('nt-subject'), chSel = document.getElementById('nt-chapter');
        subjSel.onchange = () => {
          const list = appState.data.chapters.filter(c => c.subject === subjSel.value);
          chSel.innerHTML = `<option value="">General</option>` + list.map(c => `<option value="${c.id}">${escapeHtml(c.title)}</option>`).join('');
        };
        document.getElementById('note-modal-form').onsubmit = (e) => {
          e.preventDefault();
          const payload = { id: editNote ? editNote.id : uid('nt'), title: document.getElementById('nt-title').value.trim(), subject: subjSel.value, chapterId: chSel.value, content: document.getElementById('nt-content').value.trim(), updatedAt: toLocalDateStr() };
          if (editNote) { const idx = appState.data.notes.findIndex(x => x.id === editNote.id); if (idx >= 0) appState.data.notes[idx] = payload; showToast('Note updated'); }
          else { appState.data.notes.unshift(payload); showToast('Note saved'); }
          persistCurrentUserData(); closeModal(); render();
        };
      });
    }

    /* ==========================================================================
       12. GLOBAL EVENT BINDING & RENDER LOOP
       ========================================================================== */
    function render() {
      const root = document.getElementById('root');
      if (appState.screen === 'landing') root.innerHTML = renderLanding();
      else if (appState.screen === 'auth') root.innerHTML = renderAuth();
      else root.innerHTML = renderAppShell();
      bindDynamicEvents();
    }

    function bindDynamicEvents() {
      const loginForm = document.getElementById('login-form');
      if (loginForm) {
        loginForm.onsubmit = (e) => {
          e.preventDefault();
          const email = document.getElementById('login-email').value.trim().toLowerCase(), pw = document.getElementById('login-password').value;
          const user = loadUsers().find(u => u.email.toLowerCase() === email && u.passwordHash === simpleHash(pw));
          if (!user) {
            const err = document.getElementById('auth-error');
            err.textContent = 'Invalid email or password. Please check your credentials or try a sample account.';
            err.classList.remove('hidden'); return;
          }
          setSessionUserId(user.id); appState.user = user; appState.data = loadUserData(user.id, user.exam);
          appState.screen = 'app'; appState.section = 'dashboard'; pulseLoader(); showToast(`Welcome back, ${user.name}!`); render();
        };
      }

      const regForm = document.getElementById('register-form');
      if (regForm) {
        regForm.querySelectorAll('input[name="reg-exam"]').forEach(r => {
          r.onchange = () => {
            document.getElementById('opt-neet').classList.toggle('selected', r.value === 'NEET' && r.checked);
            document.getElementById('opt-jee').classList.toggle('selected', r.value === 'JEE' && r.checked);
          };
        });
        regForm.onsubmit = (e) => {
          e.preventDefault();
          const name = document.getElementById('reg-name').value.trim(), email = document.getElementById('reg-email').value.trim().toLowerCase();
          const pw = document.getElementById('reg-password').value, exam = regForm.querySelector('input[name="reg-exam"]:checked').value;
          const targetYear = document.getElementById('reg-year').value, prepLevel = document.getElementById('reg-level').value;
          const dailyGoalHours = Math.max(1, Math.min(16, Number(document.getElementById('reg-goal').value) || 6));
          const users = loadUsers();
          if (users.some(u => u.email.toLowerCase() === email)) {
            const err = document.getElementById('auth-error');
            err.textContent = 'An account with this email already exists. Please sign in instead.';
            err.classList.remove('hidden'); return;
          }
          const newUser = {
            id: uid('usr'), name, email, passwordHash: simpleHash(pw), exam, targetYear, prepLevel, dailyGoalHours,
            createdAt: toLocalDateStr(), preferences: { studyReminders: true, deadlineAlerts: true, revisionPrompts: true, timerSound: true }
          };
          users.push(newUser); saveUsers(users); setSessionUserId(newUser.id);
          appState.user = newUser; appState.data = loadUserData(newUser.id, newUser.exam);
          appState.screen = 'app'; appState.section = 'dashboard'; pulseLoader(); showToast(`Account created for ${exam} ${targetYear}!`); render();
        };
      }

      const mobBtn = document.getElementById('mobile-menu-btn');
      if (mobBtn) mobBtn.onclick = () => { appState.mobileSidebarOpen = !appState.mobileSidebarOpen; render(); };
      const overlay = document.getElementById('sidebar-overlay');
      if (overlay) overlay.onclick = () => { appState.mobileSidebarOpen = false; render(); };

      const notifBtn = document.getElementById('notif-toggle-btn');
      if (notifBtn) notifBtn.onclick = (e) => { e.stopPropagation(); appState.notifOpen = !appState.notifOpen; render(); };

      const searchInput = document.getElementById('global-search-input');
      if (searchInput) {
        searchInput.oninput = (e) => { appState.searchQuery = e.target.value; renderGlobalSearchDropdown(); };
        if (appState.searchQuery) renderGlobalSearchDropdown();
      }

      const pDate = document.getElementById('planner-date-picker');
      if (pDate) pDate.onchange = (e) => { appState.plannerDate = e.target.value || toLocalDateStr(); render(); };
      const pSubj = document.getElementById('planner-subject-filter');
      if (pSubj) pSubj.onchange = (e) => { appState.plannerFilterSubject = e.target.value; render(); };

      const tSubj = document.getElementById('timer-subject-select');
      if (tSubj) tSubj.onchange = (e) => { appState.timer.subject = e.target.value; appState.timer.chapterId = ''; render(); };
      const tChap = document.getElementById('timer-chapter-select');
      if (tChap) tChap.onchange = (e) => { appState.timer.chapterId = e.target.value; };

      const sStat = document.getElementById('syllabus-status-filter');
      if (sStat) sStat.onchange = (e) => { appState.syllabusStatus = e.target.value; render(); };
      const sSearch = document.getElementById('syllabus-search-input');
      if (sSearch) sSearch.oninput = (e) => {
        appState.syllabusSearch = e.target.value; render();
        const el = document.getElementById('syllabus-search-input');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      };

      const nSearch = document.getElementById('notes-search-input');
      if (nSearch) nSearch.oninput = (e) => {
        appState.notesSearch = e.target.value; render();
        const el = document.getElementById('notes-search-input');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      };

      const setProfForm = document.getElementById('settings-profile-form');
      if (setProfForm) {
        setProfForm.onsubmit = (e) => {
          e.preventDefault();
          const newExam = document.getElementById('set-exam').value, oldExam = appState.user.exam;
          appState.user.name = document.getElementById('set-name').value.trim();
          appState.user.email = document.getElementById('set-email').value.trim().toLowerCase();
          appState.user.exam = newExam;
          appState.user.targetYear = document.getElementById('set-year').value;
          appState.user.prepLevel = document.getElementById('set-level').value;
          appState.user.dailyGoalHours = Math.max(1, Math.min(16, Number(document.getElementById('set-goal').value) || 6));

          if (oldExam !== newExam) {
            EXAM_SUBJECTS[newExam].forEach(s => {
              if (!appState.data.chapters.some(c => c.subject === s)) {
                (DEFAULT_SYLLABUS[s] || []).forEach(title => {
                  appState.data.chapters.push({ id: uid('ch'), subject: s, title, status: 'Not Started', progress: 0, deadline: '', notes: '', markedForRevision: false, revisions: { first: false, second: false, third: false }, lastRevised: '' });
                });
              }
            });
            appState.timer.subject = EXAM_SUBJECTS[newExam][0];
            persistCurrentUserData();
          }
          saveUsers(loadUsers().map(u => u.id === appState.user.id ? appState.user : u));
          showToast('Profile settings saved'); render();
        };
      }

      const setPrefsForm = document.getElementById('settings-prefs-form');
      if (setPrefsForm) {
        setPrefsForm.onsubmit = (e) => {
          e.preventDefault();
          appState.user.preferences = {
            studyReminders: document.getElementById('pref-study').checked,
            deadlineAlerts: document.getElementById('pref-deadline').checked,
            revisionPrompts: document.getElementById('pref-revision').checked,
            timerSound: document.getElementById('pref-sound').checked
          };
          saveUsers(loadUsers().map(u => u.id === appState.user.id ? appState.user : u));
          showToast('Notification preferences updated');
        };
      }

      const setPwForm = document.getElementById('settings-password-form');
      if (setPwForm) {
        setPwForm.onsubmit = (e) => {
          e.preventDefault();
          if (simpleHash(document.getElementById('pw-current').value) !== appState.user.passwordHash) {
            showToast('Current password is incorrect'); return;
          }
          appState.user.passwordHash = simpleHash(document.getElementById('pw-new').value);
          saveUsers(loadUsers().map(u => u.id === appState.user.id ? appState.user : u));
          setPwForm.reset(); showToast('Password updated successfully');
        };
      }
    }

    function renderGlobalSearchDropdown() {
      const container = document.getElementById('global-search-results');
      if (!container) return;
      const q = appState.searchQuery.trim().toLowerCase();
      if (!q) { container.innerHTML = ''; return; }
      const hits = [];
      appState.data.chapters.filter(c => c.title.toLowerCase().includes(q)).slice(0, 4).forEach(c => hits.push({ label: c.title, sub: `Chapter • ${c.subject}`, section: 'syllabus' }));
      appState.data.tasks.filter(t => t.title.toLowerCase().includes(q)).slice(0, 3).forEach(t => hits.push({ label: t.title, sub: `Task • ${t.date}`, section: 'planner' }));
      appState.data.notes.filter(n => n.title.toLowerCase().includes(q)).slice(0, 3).forEach(n => hits.push({ label: n.title, sub: `Note • ${n.subject}`, section: 'notes' }));
      appState.data.mockTests.filter(t => t.name.toLowerCase().includes(q)).slice(0, 2).forEach(t => hits.push({ label: t.name, sub: `Mock Test • ${t.obtainedMarks}/${t.totalMarks}`, section: 'tests' }));

      container.innerHTML = `
        <div class="search-dropdown">
          ${hits.length === 0 ? `<div class="muted" style="padding:12px;font-size:0.8rem;">No matching records found.</div>` :
            hits.map(h => `
              <button data-action="search-jump" data-section="${h.section}" style="width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);">
                <div style="font-size:0.825rem;font-weight:600;color:var(--navy);">${escapeHtml(h.label)}</div>
                <div class="muted" style="font-size:0.72rem;">${escapeHtml(h.sub)}</div>
              </button>
            `).join('')
          }
        </div>
      `;
    }

    // Interactive chart & heatmap hover tooltips
    document.addEventListener('mouseover', (e) => {
      const tipTarget = e.target.closest('.svg-tip-target');
      const tipEl = document.getElementById('chart-tooltip');
      if (!tipTarget || !tipEl) return;
      tipEl.textContent = tipTarget.dataset.tip;
      tipEl.classList.remove('hidden');
      tipEl.style.left = `${e.clientX + 12}px`;
      tipEl.style.top = `${e.clientY - 28}px`;
    });
    document.addEventListener('mousemove', (e) => {
      const tipEl = document.getElementById('chart-tooltip');
      if (tipEl && !tipEl.classList.contains('hidden')) {
        tipEl.style.left = `${e.clientX + 12}px`;
        tipEl.style.top = `${e.clientY - 28}px`;
      }
    });
    document.addEventListener('mouseout', (e) => {
      if (e.target.closest('.svg-tip-target')) {
        const tipEl = document.getElementById('chart-tooltip');
        if (tipEl) tipEl.classList.add('hidden');
      }
    });

    // Global delegated clicks
    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) {
        if (appState.notifOpen && !e.target.closest('#notif-popover')) { appState.notifOpen = false; render(); }
        return;
      }
      const action = target.dataset.action;
      switch (action) {
        case 'toggle-landing-menu': appState.landingMenuOpen = !appState.landingMenuOpen; render(); break;
        case 'close-landing-menu': appState.landingMenuOpen = false; render(); break;
        case 'go-landing': appState.screen = 'landing'; appState.landingMenuOpen = false; pulseLoader(); render(); break;
        case 'go-auth': appState.screen = 'auth'; appState.authMode = target.dataset.mode || 'login'; appState.landingMenuOpen = false; pulseLoader(); render(); break;
        case 'switch-auth': appState.authMode = target.dataset.mode; render(); break;
        case 'demo-login': loginDemoAccount(target.dataset.exam || 'NEET'); break;
        case 'nav': appState.section = target.dataset.section; appState.mobileSidebarOpen = false; appState.notifOpen = false; pulseLoader(); render(); break;
        case 'search-jump': appState.searchQuery = ''; appState.section = target.dataset.section; pulseLoader(); render(); break;
        case 'mark-notifs-read': computeMetrics().notifications.forEach(n => appState.readNotifIds.add(n.id)); render(); break;
        case 'open-task-modal': openTaskModal(null, target.dataset.date || null); break;
        case 'edit-task': { const t = appState.data.tasks.find(x => x.id === target.dataset.id); if (t) openTaskModal(t); break; }
        case 'delete-task': appState.data.tasks = appState.data.tasks.filter(x => x.id !== target.dataset.id); persistCurrentUserData(); showToast('Task deleted'); render(); break;
        case 'set-planner-view': appState.plannerView = target.dataset.view; render(); break;
        case 'planner-shift-day': appState.plannerDate = addDays(appState.plannerDate, Number(target.dataset.delta)); render(); break;
        case 'planner-today': appState.plannerDate = toLocalDateStr(); render(); break;
        case 'select-planner-date': appState.plannerDate = target.dataset.date; render(); break;
        case 'timer-mode': setTimerMode(target.dataset.mode); break;
        case 'apply-custom-timer': { const inp = document.getElementById('custom-timer-mins'); appState.timer.customMinutes = Math.max(1, Math.min(180, Number(inp?.value) || 45)); setTimerMode('custom'); break; }
        case 'timer-start': startTimer(); break;
        case 'timer-pause': pauseTimer(); break;
        case 'timer-reset': resetTimer(); break;
        case 'timer-complete-early': completeTimerSession(true); break;
        case 'start-timer-subject': appState.timer.subject = target.dataset.subject; appState.timer.chapterId = ''; appState.section = 'timer'; pulseLoader(); render(); break;
        case 'jump-syllabus-subject': appState.syllabusSubject = target.dataset.subject; appState.section = 'syllabus'; pulseLoader(); render(); break;
        case 'filter-syllabus-subject': appState.syllabusSubject = target.dataset.subject; render(); break;
        case 'open-chapter-modal': openChapterModal(); break;
        case 'edit-chapter': { const ch = appState.data.chapters.find(x => x.id === target.dataset.id); if (ch) openChapterModal(ch); break; }
        case 'delete-chapter': appState.data.chapters = appState.data.chapters.filter(x => x.id !== target.dataset.id); persistCurrentUserData(); showToast('Chapter removed'); render(); break;
        case 'toggle-chapter-rev': {
          const ch = appState.data.chapters.find(x => x.id === target.dataset.id), rev = target.dataset.rev;
          if (ch) {
            if (!ch.revisions) ch.revisions = { first: false, second: false, third: false };
            ch.revisions[rev] = !ch.revisions[rev]; ch.lastRevised = toLocalDateStr(); persistCurrentUserData(); render();
          }
          break;
        }
        case 'toggle-mark-revision': { const ch = appState.data.chapters.find(x => x.id === target.dataset.id); if (ch) { ch.markedForRevision = !ch.markedForRevision; persistCurrentUserData(); render(); } break; }
        case 'open-test-modal': openTestModal(); break;
        case 'delete-test': appState.data.mockTests = appState.data.mockTests.filter(x => x.id !== target.dataset.id); persistCurrentUserData(); showToast('Mock test removed'); render(); break;
        case 'set-notes-tab': appState.notesTab = target.dataset.tab; render(); break;
        case 'filter-notes-subject': appState.notesSubjectFilter = target.dataset.subject; render(); break;
        case 'open-note-modal': openNoteModal(); break;
        case 'edit-note': { const nt = appState.data.notes.find(x => x.id === target.dataset.id); if (nt) openNoteModal(nt); break; }
        case 'delete-note': appState.data.notes = appState.data.notes.filter(x => x.id !== target.dataset.id); persistCurrentUserData(); showToast('Note deleted'); render(); break;
        case 'set-analytics-range': appState.analyticsRange = Number(target.dataset.range); render(); break;
        case 'logout': stopTimerInterval(); setSessionUserId(null); appState.user = null; appState.data = null; appState.screen = 'landing'; showToast('Signed out'); render(); break;
        case 'export-data': {
          const blob = new Blob([JSON.stringify({ user: appState.user, data: appState.data }, null, 2)], { type: 'application/json' });
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `teachsaathi-backup-${toLocalDateStr()}.json`; a.click();
          showToast('Backup exported as JSON'); break;
        }
        case 'seed-sample-data': appState.data = generateSampleData(appState.user.exam); persistCurrentUserData(); showToast('Sample study activity loaded'); render(); break;
        case 'delete-account':
          if (confirm('Delete this local student account and all study records? This cannot be undone.')) {
            const uidDel = appState.user.id;
            saveUsers(loadUsers().filter(u => u.id !== uidDel));
            localStorage.removeItem(STORAGE_DATA_PREFIX + uidDel);
            setSessionUserId(null); appState.user = null; appState.data = null; appState.screen = 'landing';
            showToast('Account deleted'); render();
          }
          break;
      }
    });

    document.addEventListener('change', (e) => {
      const target = e.target, action = target.dataset.action;
      if (!action) return;
      if (action === 'toggle-task') {
        const t = appState.data.tasks.find(x => x.id === target.dataset.id);
        if (t) { t.completed = target.checked; persistCurrentUserData(); render(); }
      } else if (action === 'change-chapter-status') {
        const ch = appState.data.chapters.find(x => x.id === target.dataset.id);
        if (ch) {
          ch.status = target.value;
          if (ch.status === 'Completed') ch.progress = 100;
          else if (ch.status === 'Not Started') ch.progress = 0;
          else if (ch.status === 'In Progress' && (ch.progress === 0 || ch.progress === 100)) ch.progress = 40;
          persistCurrentUserData(); render();
        }
      } else if (action === 'change-chapter-progress') {
        const ch = appState.data.chapters.find(x => x.id === target.dataset.id);
        if (ch) {
          ch.progress = Number(target.value);
          ch.status = ch.progress >= 100 ? 'Completed' : ch.progress === 0 ? 'Not Started' : 'In Progress';
          persistCurrentUserData(); render();
        }
      }
    });

    /* ==========================================================================
       13. BOOTSTRAP
       ========================================================================== */
    (function init() {
      const sessionId = getSessionUserId();
      if (sessionId) {
        const user = loadUsers().find(u => u.id === sessionId);
        if (user) {
          appState.user = user;
          appState.data = loadUserData(user.id, user.exam);
          appState.screen = 'app';
        }
      }
      render();
    })();
  </script>
